<script>
var POSTS = [{"id": "post-21", "file": "post-21.png", "title": "The Alamo, 1836", "story": "On the morning of 23 February 1836, lookouts on the walls of the Alamo mission in San Antonio saw dust on the horizon. General Antonio Lopez de Santa Anna had arrived with his Mexican army, and the siege of the Alamo had begun. Inside the old Spanish mission stood fewer than 200 Texian and Tejano volunteers under two young commanders, William Travis and James Bowie, and among them the famous frontiersman Davy Crockett, who had arrived from Tennessee with a dozen men.\n\nTravis knew no help was coming in time. On 24 February he wrote the letter that became one of the most famous in American history, addressed \"To the People of Texas and All Americans in the World\". He promised victory or death, and he asked for reinforcements. Only 32 men from the town of Gonzales managed to slip through the Mexican lines to join him.\n\nFor 13 days the Mexican guns pounded the crumbling walls. The defenders answered with their rifles, and by most accounts they killed or wounded 400 to 600 of Santa Anna's men. Then, before dawn on 6 March, the Mexican army stormed the walls in four columns. After repelling two attacks, the Texians were overwhelmed. Within an hour, every defender inside was dead, including Travis, Bowie and Crockett. The women and children were spared.\n\nSanta Anna believed the slaughter would crush the rebellion. He was wrong. The names of the dead became a battle cry, and six weeks later, on 21 April, Sam Houston's army charged the Mexican camp at San Jacinto shouting \"Remember the Alamo!\" In 18 minutes the battle was over, Santa Anna was captured, and Texas was free. The men who died at the Alamo had bought that victory with their lives."}, {"id": "post-22", "file": "post-22.png", "title": "Sacagawea and the Lewis and Clark Expedition, 1805", "story": "In the winter of 1804, at a trading post called Fort Mandan on the upper Missouri River, two American explorers made the best decision of their expedition. Meriwether Lewis and William Clark had been sent by President Thomas Jefferson to find a way across the continent to the Pacific Ocean, and they needed someone who could talk to the Shoshone people and buy horses for the crossing of the Rocky Mountains. They hired a French-Canadian fur trader named Toussaint Charbonneau, and with him came his young Shoshone wife, Sacagawea. She was about sixteen years old, and she was pregnant.\n\nOn 11 February 1805, Sacagawea gave birth to a baby boy, Jean Baptiste, whom the men nicknamed Little Pomp. Two months later, on 7 April, the expedition set out up the Missouri in canoes, and Sacagawea went with them, her baby strapped to her back. Over the months that followed she proved herself again and again. She found edible plants when the men were hungry, she made moccasins and clothing, and when a canoe overturned she calmly saved the journals and instruments while the men panicked. Because a woman and a baby travelled with the party, the tribes they met knew at once that this was not a war party, and they were welcomed instead of attacked.\n\nIn the mountains, her knowledge saved the expedition a second time. She recognised the country of her childhood, she found the Shoshone and persuaded them to sell horses, and she guided the party through the passes to the Pacific, which they reached in November 1805. They spent the winter at the coast and returned to Fort Mandan in August 1806, having travelled more than 7,000 miles in all. Sacagawea had carried her son about 4,500 of those miles. Without her, the expedition that mapped America might never have come home."}, {"id": "post-23", "file": "post-23.png", "title": "Desmond Doss at Hacksaw Ridge, 1945", "story": "He went to war refusing to carry a gun, and he saved 75 men in a single day.\n\nDesmond Doss was a skinny Seventh-day Adventist from Lynchburg, Virginia, who believed the commandment \"Thou shalt not kill\" applied to him even in uniform. He could have stayed home, because his shipyard job offered him a deferment, but he felt called to serve, so he enlisted as a medic, the one job where he could save lives instead of taking them.\n\nThe Army did not know what to do with him. In training, men threw shoes at him while he prayed, and officers tried to force him out. He would not touch a weapon and he would not work on his Saturday Sabbath, but he never complained and he never gave in.\n\nIn April 1945 his unit, the 307th Infantry, was ordered up a sheer 400-foot cliff on Okinawa called the Maeda Escarpment, known to the men as Hacksaw Ridge. At the top, Japanese fire cut the company to pieces and the order came to retreat. Everyone went down the cargo nets except Doss. He stayed on that fire-swept plateau alone with the wounded.\n\nFor the next twelve hours he crawled from man to man under shell and machine-gun fire, dragged each one to the cliff edge and lowered him to safety in a rope litter, one at a time. Between rescues he prayed the same prayer: \"Lord, please help me get one more.\" By nightfall he had brought down 75 men, including soldiers who had once mocked him.\n\nDays later he was badly wounded himself, and gave up his own stretcher to a man he believed was hurt worse.\n\nOn October 12, 1945, President Harry Truman placed the Medal of Honor around his neck. Doss was the first conscientious objector in American history to receive it. He had proved that a man does not need a weapon to be the bravest soldier on the field.\n\nHad you ever heard of the soldier who saved 75 men without firing a single shot?"}, {"id": "post-24", "file": "post-24.png", "title": "Robert Smalls Steals a Confederate Warship, 1862", "story": "He stole a Confederate warship before breakfast, and freed everyone he loved.\n\nRobert Smalls was born enslaved in Beaufort, South Carolina, in 1839. Sent to Charleston at twelve to hire out his labor, he kept just one dollar of the sixteen he earned, and he fell in love with the sea. By 1861 he was the most trusted pilot in Charleston Harbor, and he was still property. He and his wife Hannah had tried to buy their family's freedom, but the price of 800 dollars was far beyond what they could save.\n\nThen the Civil War gave him another way. Smalls was put to work aboard the Planter, a Confederate transport steamer carrying guns between the harbor forts. He learned every signal, every checkpoint, every channel. And he waited.\n\nIn the early hours of May 13, 1862, the ship's white officers broke the rules and spent the night ashore. Smalls put on the captain's straw hat, gathered the enslaved crew, and steamed quietly to another wharf, where Hannah, their children and the crew's families were hiding. Then he did the boldest thing of all: he sailed straight through the harbor, giving the correct whistle signals at every fort, including mighty Fort Sumter, whose guns never suspected a thing.\n\nOutside the harbor waited the Union blockade. Smalls struck the Confederate flags, raised a white bed sheet, and surrendered the Planter, with its guns, its ammunition and its code book, to the USS Onward. In one night, 16 enslaved people became free.\n\nThe North made him a hero. He met President Lincoln, piloted Union ships for the rest of the war, and in December 1863 took command of the Planter as the first Black captain of a United States vessel. After the war he bought the very house in Beaufort where he had been enslaved, served in the United States Congress, and wrote the South Carolina law that created the first free public school system in America.\n\nThe man they had owned ended up owning the house, and helping to run the country.\n\nWhich part of his story surprises you more, the stolen warship or the seat in Congress?"}, {"id": "post-25", "file": "post-25.png", "title": "Ruby Bridges Walks to School, 1960", "story": "She was six years old, and it took four federal marshals to walk her to school.\n\nOn the morning of November 14, 1960, Ruby Bridges put on her best white dress and walked up the steps of William Frantz Elementary School in New Orleans. She was the first Black child to attend an all-white elementary school in the South, and an angry crowd was waiting behind the barricades, shouting and waving signs. Ruby thought it was Mardi Gras.\n\nShe spent her first day sitting in the principal's office while white parents stormed in and pulled their own children out, one classroom after another, until the school was empty. On the second day, a young teacher from Boston named Barbara Henry took Ruby into an empty classroom, and for the entire school year that classroom held exactly two people. Every other teacher had refused to teach her.\n\nFor a year the marshals walked her past the same crowds every morning. One woman threatened to poison her, so Ruby was allowed to eat only food she brought from home. Another woman held up a Black doll in a tiny coffin. Ruby prayed on the school steps, not for herself, but for the crowd, because she said they needed it.\n\nHer family paid for that walk. Her father lost his job at the gas station. The local grocery store refused to sell them food. Her grandparents were thrown off the land they farmed in Mississippi. Through all of it, Ruby never missed a single day of school.\n\nThe next year the crowds were gone, the classrooms filled again, and Ruby simply went to school like any other child. Norman Rockwell turned her walk into one of the most famous paintings in America, The Problem We All Live With.\n\nShe grew up, raised four sons, and founded the Ruby Bridges Foundation to teach children tolerance. In 1960, the bravest person in New Orleans weighed about forty pounds and carried her own schoolbooks.\n\nWere you ever taught her story when you were in school?"}, {"id": "post-26", "file": "post-26.png", "title": "Alvin York in the Argonne Forest, 1918", "story": "\"Well, York,\" his general said, \"I hear you have captured the whole German army.\" York shook his head. \"No sir. I got only 132.\"\n\nAlvin York was a dirt-poor Tennessee farm boy, a hard-drinking brawler who found religion and was then drafted into a war he was not sure his faith allowed him to fight. His request to be excused from combat as a conscientious objector was denied, and after long talks with his captain and long nights with his Bible, he decided he would go.\n\nOn October 8, 1918, in the Argonne Forest in France, Corporal York was one of 17 men sent behind German lines to silence the machine guns that were shredding their regiment. The patrol surprised a group of Germans and took them prisoner, and then the hillside erupted. Machine-gun fire killed six Americans and wounded three, and suddenly York, a crack shot who had hunted turkeys in the Tennessee hills, was the senior man left standing.\n\nWhat he did next sounds invented. Standing in the open, he picked off the German gunners one by one, every time a head rose above the trench. When six Germans charged him with fixed bayonets, he drew his pistol and stopped all six. The German commander, who had emptied his own pistol at York without hitting him once, walked out and surrendered his entire position.\n\nYork and his seven surviving men marched 132 prisoners back to the American lines, collecting still more along the way. He had killed at least 25 enemy soldiers and silenced some 35 machine guns, and he had opened the way for his regiment to advance.\n\nHe was promoted to sergeant on the spot, and later received the Medal of Honor from General Pershing himself. Back home he stayed the same quiet man, using his fame to build a school for the mountain children of Tennessee.\n\nDo you believe one man really did all of that in a single morning?"}, {"id": "post-27", "file": "post-27.png", "title": "Charity Adams and the 6888th Battalion, 1945", "story": "Seventeen million letters were sitting in English warehouses, and some soldiers had not heard from home in two years.\n\nBy early 1945, the Army's mail system in Europe had collapsed under its own weight. Mountains of letters and parcels, an estimated 17 million pieces, were stacked to the rafters in Birmingham, addressed to men who kept moving with the front. Morale was sinking with every missing letter. The Army's answer was a brand-new unit that many of its own officers did not believe in: the 6888th Central Postal Directory Battalion, 855 Black women of the Women's Army Corps, commanded by a 26-year-old major from South Carolina named Charity Adams, the first Black woman officer in the Corps.\n\nThey were given six months to clear the backlog. Adams put her women on three shifts a day, seven days a week, working through the night in cold, dim warehouses. They built a card index of seven million names to untangle the thousands of soldiers who shared the same name, tracked down men who had been wounded, moved or killed, and sent the mail on its way. Their motto said everything: \"No mail, low morale.\"\n\nThey finished Birmingham in three months, half the time allowed. Then the Army sent them to Rouen, in France, where another mountain of undelivered mail was waiting, and they cleared that too.\n\nThere was no parade when they came home in 1946. The unit was quietly disbanded, and for decades almost nobody knew their names. Charity Adams rose to lieutenant colonel, the highest-ranking Black woman in the Army of her time, and spent the rest of her life in education and service.\n\nRecognition finally arrived: a monument at Fort Leavenworth, a Meritorious Unit Commendation in 2019, and the Congressional Gold Medal. The women who carried an army's heart in their hands had waited more than seventy years to be thanked.\n\nHad you ever heard of the 6888th before today?"}, {"id": "post-28", "file": "post-28.png", "title": "The Last Penny, 1793–2025", "story": "The penny is dead. This week, after 232 years in America's pockets, the one-cent coin was ended for good.\n\nThe penny was there at the very beginning. The first cents were struck in Philadelphia in 1793, among the first coins ever made by the young United States Mint. Those early pennies were pure copper and bigger than the coin we know. In the two centuries that followed, the penny shrank, changed designs and survived every war, depression and reinvention of American money.\n\nIn 1909, for the hundredth anniversary of his birth, Abraham Lincoln took his place on the cent. He was the first president ever put on an American coin, and his profile, designed by the sculptor Victor David Brenner, became the most familiar face in the country. Wheat ears framed him until 1958, the Lincoln Memorial followed in 1959, and the Union Shield arrived in 2010. Generations of children learned his face from the change in a parent's hand.\n\nWhat killed the penny was simple arithmetic. By the 2020s it cost 3.69 cents to manufacture a coin worth exactly one cent, and the loss ran to tens of millions of dollars a year. The coin itself had quietly become mostly zinc in 1982, wearing only a skin of copper. In February 2025, the Treasury was ordered to stop production, and on November 12, 2025, the Philadelphia Mint struck the last circulating penny. The Treasurer of the United States stamped the final coin himself, and the Mint's acting director marked the end of 232 years of penny manufacturing.\n\nOn November 20, 2026, the Common Cents Act made it permanent. No more pennies will be made for circulation. Cash totals will round to the nearest nickel, the coins in your pocket stay legal tender, and the Mint reckons the country will save about 56 million dollars a year. An estimated 114 billion pennies are still out there, in jars, drawers, fountains and car seats, slowly turning from money into history.\n\nSo check your junk drawer tonight. Are you going to keep your pennies as little pieces of 1793, or spend them while you still can?"}, {"id": "post-29", "file": "post-29.png", "title": "The First Thanksgiving, 1621", "story": "This Thursday, the guest list at your table is 405 years old.\n\nIn September 1620, the Mayflower left England with 102 passengers, religious separatists, traders and servants chasing a new life. The crossing took 66 days. They reached Cape Cod in November, cold, sick and short of food, and that first winter did what the ocean could not. By spring, about half of them were dead.\n\nThe survivors would have followed them without help. A Patuxet man named Tisquantum, called Squanto, who spoke English because he had been kidnapped to Europe years before, taught the colonists to plant corn with fish for fertilizer and showed them where to fish and hunt. The Wampanoag people, led by Ousamequin, the Massasoit, made a peace that held for a generation.\n\nIn the autumn of 1621, the harvest came in, and Governor William Bradford sent four men out fowling. Edward Winslow wrote home on December 11, 1621, and his letter is nearly all we know: the Massasoit arrived with about 90 men, the guests brought five deer, and for three days they feasted together. Nobody recorded a turkey. The menu was fowl, venison, corn and squash.\n\nIt took a magazine editor to turn that feast into a national day. Sarah Josepha Hale campaigned for years, writing to president after president, until Abraham Lincoln listened. On October 3, 1863, in the middle of the Civil War, Lincoln proclaimed a national Thanksgiving, and it fell that year on November 26. This Thursday, November 26, 2026, it lands on the same date, 405 years after the feast and 163 after the proclamation.\n\nSo when you sit down this week, whose place at the table matters more: the 53 who survived, or the 90 who showed up as guests?"}, {"id": "post-30", "file": "post-30.png", "title": "Washington's Triumphal Arch, 2026", "story": "America is throwing itself a 250th birthday party, and the monument is already in court.\n\nThe plan is enormous: a triumphal arch 250 feet tall, white stone trimmed with gold, crowned by a winged figure and engraved with the words ONE NATION UNDER GOD, standing at Memorial Circle in Arlington, between the Memorial Bridge and Arlington National Cemetery. At a reported cost of about 1 billion dollars, it would rise to roughly twice the height of the Lincoln Memorial across the river, built to honor the nation's 250th anniversary.\n\nOn November 5, 2026, the National Capital Planning Commission approved it, 8 to 4. Within an hour, Judge Tanya Chutkan in Washington had blocked construction, and she later extended her order through December 3. On November 10, nine members of the Kennedy family moved to join another lawsuit, arguing the arch could block the view from the Kennedy gravesites and the Eternal Flame at Arlington. Then, on Friday, November 20, Judge Leonie Brinkema in Virginia said from the bench that she would issue a preliminary injunction too, calling the effort a rushed job.\n\nThe ground itself explains the fight. Memorial Bridge, opened in 1932, was built as a symbol of reunion after the Civil War, deliberately linking the Lincoln Memorial to Arlington House, Robert E. Lee's former home. The view between them is one of the most protected in America, and Washington has guarded its skyline for more than a century. This is also the city where the Washington Monument stood unfinished for over 20 years while the nation argued, then went to war with itself.\n\nThe arch may still rise. But first it has to survive the oldest Washington tradition of all: the fight over what America should look like. Should a birthday gift this big need everyone's blessing, or just a builder bold enough to start?"}, {"id": "post-31", "file": "post-31.png", "title": "Project Blue Book, 1952–1969", "story": "The United States government just handed you 43 more UFO files, and some of them are older than your grandparents.\n\nOn November 20, 2026, the Department of War published the eighth release in its PURSUE program, 43 new files, 40 documents and 3 videos, bringing the public archive at war.gov/UFO to 521 files since the first release on May 8, 2026. Buried in the new batch are Project Blue Book-era records, CIA papers from 1952, and a 1953 sighting report by Kelly Johnson, one of the greatest aircraft designers who ever lived.\n\nThe story they belong to began in the summer of 1947. On June 24, pilot Kenneth Arnold saw nine bright objects skipping over the Cascade Mountains, and the newspapers gave the age its name: flying saucers. Days later, rancher Mac Brazel found strange foil-like debris scattered across his land near Roswell, New Mexico. The Army Air Forces announced they had recovered a flying disc, then, within hours, said it was a weather balloon. America has been arguing about that week ever since.\n\nIn July 1952, unknown objects appeared over Washington itself, seen on radar and by pilots, and the Air Force found itself explaining the impossible at the largest press conference since the war. The result was Project Blue Book, run from Wright-Patterson Air Force Base in Ohio. For 17 years its officers chased down 12,618 reports. They explained nearly all of them: balloons, stars, swamp gas, hoaxes. But 701 cases defeated them, and in 1969 the Air Force closed the book, still insisting those 701 meant nothing it could identify.\n\nNow the files sit online, free, waiting. After 79 years, is the truth still in a folder somewhere, or did Blue Book already tell us everything it knew?"}, {"id": "post-32", "file": "post-32.png", "title": "The White House East Wing, 1902–2026", "story": "The most famous address in America just lost one of its wings, and the argument says as much about us as the demolition does.\n\nThe President's House has been knocked down and built back before. On August 24, 1814, British troops marched into Washington and set it on fire; legend and letters agree that Dolley Madison rescued the great portrait of George Washington before she fled. The walls survived, blackened, and by 1817 the house had risen again. It has been under reconstruction ever since, in every sense.\n\nThe East Wing came in pieces. Theodore Roosevelt added the first version in 1902, a modest entrance where visitors could hang their coats. In 1942, with a world war raging, Franklin D. Roosevelt replaced it with the two-story wing Americans know, built partly to hide the construction of an underground bunker, the Presidential Emergency Operations Center. From Rosalynn Carter's day onward, that wing was the First Lady's working home, the base for her staff, her projects and the public face of the house's hospitality.\n\nThis autumn, it came down. The wing was demolished to make way for a ballroom reported to cost about 600 million dollars, and by September 24, 2026, ballroom construction was already visible in photographs of an arrival ceremony. Former President Biden, in a People magazine interview published November 13, 2026, called the demolition disturbing and beneath the country. Supporters answer that the house has always changed with the families inside it.\n\nBoth things are true, which is exactly why the fight is so loud. Is a ballroom just the newest room in a 226-year-old work in progress, or the first change that erased something America meant to keep?"}, {"id": "post-33", "file": "post-33.png", "title": "The California Gold Rush, 1849", "story": "One shout in a sawmill ditch redrew the map of America in less than two years.\n\nOn January 24, 1848, a carpenter named James W. Marshall was building a sawmill for John Sutter on the American River at Coloma, California, when he saw flakes of gold glittering in the tailrace. Sutter tried to keep it secret. It was the worst-kept secret in history. San Francisco merchant Sam Brannan marched through the streets waving a vial of gold dust and shouting the news, then quietly sold the miners everything they needed. In December 1848, President James K. Polk confirmed the discovery to Congress, and the world came running.\n\nIn 1849 alone, about 90,000 people, the forty-niners, poured into California, half by sea around Cape Horn or across Panama, half overland on wagon trails. By 1855 the total reached roughly 300,000, from Mexico, Chile, China, Australia and all over Europe. San Francisco exploded from fewer than 1,000 people to 25,000 by 1850 and 36,000 by 1852. Gold production peaked in 1852 at 81 million dollars.\n\nAlmost none of the miners got rich. The easy gold ran out fast, prices for eggs and boots went mad, and the reliable fortunes belonged to the Brannans, the bankers and the men selling shovels. For California's Native peoples, the rush was a catastrophe: they were driven from their lands, and disease, starvation and violence cut their numbers terribly.\n\nThe rush did in two years what politics could not. California skipped being a territory entirely and entered the Union on September 9, 1850, as the 31st state. Every lottery line and market frenzy since is the same fever in new clothes. If gold were found tomorrow an hour from your home, would you run?"}, {"id": "post-34", "file": "post-34.png", "title": "The Brooklyn Bridge, 1883", "story": "The most famous bridge in America was finished by a woman nobody hired, working for a husband who could not leave his room.\n\nJohn Augustus Roebling, the German-born engineer who designed the great bridge over the East River, never saw a stone laid. In 1869, taking compass readings at a Brooklyn ferry slip, his foot was crushed between the pilings and an incoming boat. He died of tetanus three weeks later. His son Washington Roebling, 32 years old and a Civil War veteran, took command.\n\nThen the bridge took him too. The foundations were sunk in pressurized underwater chambers called caissons, and the work gave Washington a crippling case of caisson disease, the bends. From 1872 he directed the greatest construction project in America from a room in Brooklyn Heights, watching the towers rise through a telescope, while his wife did the walking.\n\nEmily Warren Roebling had married an engineer; now she became one. She studied mathematics and bridge engineering, carried her husband's written orders to the site every day for 11 years, answered the engineers, faced down the politicians and suppliers, and learned the work so completely that rumors flew she was the real chief engineer. At least two dozen workers died building the bridge, and it cost 15 million dollars and 14 years.\n\nOn May 24, 1883, it opened: a main span of 1,595 feet, the longest suspension bridge on Earth, the first ever hung from steel wire. Emily rode across first, a rooster in her lap, before President Chester A. Arthur and Governor Grover Cleveland walked it. That day, 150,300 people and 1,800 vehicles crossed. Today about 120,000 vehicles and 4,000 pedestrians still cross daily, free. Should her name be up there beside his?"}, {"id": "post-35", "file": "post-35.png", "title": "Rosa Parks and the Montgomery Bus Boycott, 1955", "story": "On a cold December evening in 1955, a tired seamstress boarded a bus in Montgomery, Alabama, and quietly changed the course of American history. Rosa Parks had worked all day, and when the driver ordered her to give up her seat to a white passenger, she simply said no. She was arrested, fined fourteen dollars, and sent home — but her refusal lit a fire that no one could put out.\n\nWithin days, the Black community of Montgomery organised a boycott of the city buses. It was led by a young, little-known pastor named Martin Luther King Jr., and it was an act of extraordinary discipline. For 381 days, tens of thousands of people walked to work in the rain and heat, shared cars, and organised carpools rather than ride a segregated bus. The bus company lost money, the city dug in, and homes were bombed — yet the boycott held.\n\nThe fight moved to the courts as well. In a case called Browder v. Gayle, federal judges ruled that segregated buses violated the Constitution, and in November 1956 the Supreme Court agreed. On 20 December 1956, more than a year after Parks was arrested, Montgomery's buses were desegregated, and Black riders took their seats wherever they chose.\n\nRosa Parks never set out to become a symbol. She was an ordinary woman, a seamstress and a local NAACP secretary, who had simply had enough. But her quiet courage showed America that one person, refusing to move, can move a whole nation. She spent the rest of her long life fighting for civil rights, and today she is remembered as the mother of the civil rights movement.\n\nHer story asks a question that still matters: when something is plainly wrong, will you stay seated — or will you stand up?"}, {"id": "post-36", "file": "post-36.png", "title": "Jackie Robinson Breaks Baseball's Colour Line, 1947", "story": "On 15 April 1947, a 28-year-old ballplayer walked onto Ebbets Field in Brooklyn and did something no Black man had done in more than sixty years: he played Major League Baseball. Jackie Robinson, wearing number 42 for the Brooklyn Dodgers, stepped up to first base before a crowd of 26,623 — more than 14,000 of them Black fans who had come to witness history. He did not get a hit that day, but he scored the winning run in a 5-3 victory, and baseball would never be the same again.\n\nRobinson's path to that moment had been carefully planned. Dodgers president Branch Rickey had spent three years searching for the right player to break baseball's colour line, and he chose Robinson not only for his talent but for his character. Rickey warned him that he would face insults, spiked cleats, and death threats — and that he must not fight back. Robinson agreed, and for two seasons he answered hatred with dignity and brilliance.\n\nIt worked. In his rookie year he batted .297, led the league in stolen bases, and was named the first-ever Rookie of the Year. Two years later he was the National League's Most Valuable Player, and in 1955 he helped the Dodgers win their first World Series. He played ten seasons in Brooklyn, a six-time All-Star, and when he retired, the door he had opened stayed open — within a decade, every Major League team had Black players.\n\nIn 1997, fifty years after his debut, Major League Baseball retired his number 42 across the entire league, an honour no other player in any sport has received. Every year on 15 April, every player in the game wears 42 in his memory.\n\nJackie Robinson proved that talent and character can defeat prejudice. So here is the question his life still asks us: when the crowd is against you, do you have the courage to keep playing your game?"}, {"id": "post-37", "file": "post-37.png", "title": "The Hoover Dam, 1936", "story": "In the middle of the Great Depression, when millions of Americans had no work and no hope, a wall of concrete began rising in a burning desert canyon, and it changed the American West forever.\n\nThe Colorado River had always been wild. It flooded farms in spring and ran almost dry in summer, and the desert towns of Arizona, Nevada and California were desperate for its water. In 1931, the federal government gave the job to a team of contractors called Six Companies, and more than 21,000 men came to Black Canyon to build the tallest dam the world had ever seen.\n\nThe work was brutal. Summer temperatures in the canyon passed 120 degrees, and men drilled diversion tunnels through solid rock so the river could be sent around the dam site. Concrete was poured in huge blocks, with cold water running through pipes buried inside to stop the mass from cracking as it set. In all, 3.25 million cubic yards of concrete went into the dam itself. Ninety-six men died in industrial accidents on the site, and their names are remembered on a monument at the dam today.\n\nWhen it was finished, the Hoover Dam stood 726 feet high and stretched 1,244 feet across the canyon, holding back a reservoir so vast it was named Lake Mead, the largest in America. President Franklin D. Roosevelt dedicated it on 30 September 1935, calling it a symbol of what a nation could do even in its darkest hour.\n\nBehind the dam, water still spins turbines that light homes across Nevada, Arizona and California, and Lake Mead still stores water for some 25 million people. It was built to last for centuries, and nearly ninety years on, it still does the job it was built for.\n\nWhat other project from the Depression still powers millions of lives today?"}, {"id": "post-38", "file": "post-38.png", "title": "Edison and the Light Bulb, 1879", "story": "On an October night in 1879, in a small wooden laboratory in Menlo Park, New Jersey, a 32-year-old inventor watched a thread of cotton burn without burning up, and the world would never be dark again.\n\nFor centuries, night had belonged to candles, oil lamps and gaslight, all of them smoky, dangerous and dim. Thomas Edison believed electricity could do better, but every filament he tried burned out in seconds. He tested platinum, paper, wood, even coconut fibre, and failed hundreds of times. Then, in the early hours of 22 October 1879, his team tried a piece of ordinary cotton thread, baked until it turned to pure carbon and sealed inside a glass bulb with the air pumped out. It glowed for thirteen and a half hours.\n\nThat glowing thread was the breakthrough. Edison filed for a patent on 4 November 1879, and on New Year's Eve that year he invited the public to Menlo Park to see his lamps light up the winter night. The crowds came by train from New York, and they stared in wonder at streets lit by something that made no smoke and no flame.\n\nBut Edison did not stop at a bulb. He built the whole system around it, dynamos, wires, switches and meters, and on 4 September 1882 his Pearl Street Station in New York began sending electricity to 82 customers, lighting 400 lamps. It was the first commercial power station in America, and within two years it served more than 500 customers. Later filaments made from carbonized bamboo lasted 1,200 hours.\n\nEdison went on to hold 1,093 American patents, but the light bulb was the one that changed daily life for everyone on Earth. Can you imagine a single evening in your life without it?"}, {"id": "post-39", "file": "post-39.png", "title": "The Battle of Midway, 1942", "story": "Six months after Pearl Harbor, Japan was winning everywhere, and America had almost nothing left to stop it.\n\nIn the spring of 1942, Admiral Yamamoto planned a trap. Four Japanese fleet carriers, the same ships that had bombed Pearl Harbor, would seize Midway Atoll, a tiny American base about 1,300 miles northwest of Hawaii, and destroy the U.S. Pacific Fleet when it rushed to defend it. Japan brought four carriers to America's three, and one of those three, the Yorktown, had been badly damaged a month earlier at the Coral Sea. Shipyard workers were given seventy-two hours for repairs meant to take ninety days, and the Yorktown sailed.\n\nBut the Americans knew Yamamoto was coming. In a windowless basement at Pearl Harbor, Lieutenant Commander Joseph Rochefort and his codebreakers at Station Hypo had broken enough of Japan's JN-25 naval code to learn the target. They proved it with a trick, sending a fake message that Midway was short of fresh water, then watching the Japanese repeat the complaint. Nimitz knew the date, the place, and the strength of the attack, and placed his three carriers in ambush northeast of Midway.\n\nOn the morning of 4 June 1942, the battle turned on five minutes. American torpedo bombers had drawn Japan's fighter cover down to sea level, and at about 10:22 a.m., dive bombers from the Enterprise, Yorktown, and Hornet plunged onto decks crowded with armed and fueled aircraft. Akagi, Kaga, and Soryu were burning wrecks within minutes. Hiryu crippled the Yorktown, but bombers sank her the next day.\n\nJapan lost all four of its fleet carriers, 248 aircraft, and 3,057 men, including pilots it could never replace. America lost the Yorktown and about 307 men. The Japanese advance in the Pacific stopped that day and never started again. Historians call Midway the turning point of the Pacific War.\n\nIt was won by pilots, sailors, and a handful of codebreakers in a basement. What would have happened if those messages had never been read?"}, {"id": "post-40", "file": "post-40.png", "title": "The Miracle on the Hudson, 2009", "story": "Ninety seconds. That is all the time Captain Chesley Sullenberger had to decide whether 155 people would live or die.\n\nOn the afternoon of 15 January 2009, US Airways Flight 1549, an Airbus A320 bound for Charlotte, lifted off from LaGuardia with 150 passengers and five crew aboard. About a minute into the climb, at roughly 2,800 feet, the plane flew straight into a flock of Canada geese. Both engines swallowed birds, flamed, and went silent, and the jet began to fall toward the most crowded city in America.\n\nSullenberger, known to everyone as Sully, was 57 years old, a former fighter pilot with 19,663 flight hours behind him, including nearly 5,000 in the A320. He took the controls and tried to restart the engines. Nothing worked. Controllers offered LaGuardia, then Teterboro in New Jersey. Sully answered calmly that he was unable to reach either one. \"We're gonna be in the Hudson,\" he said, and told the passengers to brace for impact.\n\nWhat happened next is still studied in flight schools. Sully glided the powerless jet over the George Washington Bridge, lined it up with the river, and set it down on the freezing Hudson, near Midtown Manhattan, less than four minutes after the bird strike. The plane floated, and passengers climbed out onto the wings in the January cold as water poured in.\n\nHelp was already coming. Ferries and rescue boats converged on the sinking jet, pulling people from the wings and the icy water. All 155 people survived. One hundred were injured, five of them seriously, but there was not a single fatality. Sully walked the cabin twice to check no one was left, and was the last to leave.\n\nNew York's governor called it the Miracle on the Hudson, and the NTSB called it the most successful ditching in aviation history. Sully himself never called it a miracle. He called it the result of a lifetime of preparation meeting a moment no one could have planned. How many of us would stay that calm with ninety seconds to save everyone?"}, {"id": "post-41", "file": "post-41.png", "title": "The Battle of Gettysburg, 1863", "story": "In the summer of 1863, the Civil War hung in the balance. General Robert E. Lee marched his Confederate army north into Pennsylvania, hoping a great victory on Northern soil would break the Union's will and win foreign support. Near the small town of Gettysburg, the two armies collided, and for three days, July 1 to 3, some 165,000 men fought the largest battle ever waged on American soil.\n\nOn the first day, Union cavalry under General John Buford held the high ground long enough for infantry to seize the hills south of town. On the second day, the fighting raged at Little Round Top, the Wheatfield, Devil's Den and the Peach Orchard. At Little Round Top, Colonel Joshua Chamberlain and his 20th Maine held the very end of the Union line. Out of ammunition, they fixed bayonets and charged downhill, saving the flank and perhaps the battle.\n\nOn the third day came the climax. Against the advice of his generals, Lee ordered some 12,500 men to march across three-quarters of a mile of open ground toward the Union centre on Cemetery Ridge. It was Pickett's Charge, and it was a disaster. More than half of the men who stepped off never came back. The Union line held.\n\nWhen the guns fell silent, between 46,000 and 51,000 soldiers were dead, wounded or missing, the bloodiest battle of the war. Lee retreated to Virginia on the Fourth of July, the same day another Union victory fell at Vicksburg. The Confederacy would never again invade the North. Four months later, President Abraham Lincoln stood on that same ground and gave the Gettysburg Address, 272 words that remade the meaning of the war. The Union had held, and America would endure."}, {"id": "post-42", "file": "post-42.png", "title": "Clara Barton, Angel of the Battlefield, 1862", "story": "She was not a soldier, and she carried no weapon. But on the bloodiest battlefields of the Civil War, the men in blue came to call Clara Barton the Angel of the Battlefield.\n\nBorn on Christmas Day, 1821, in North Oxford, Massachusetts, Barton was a schoolteacher, then one of the first women to work for the federal government, as a clerk in the U.S. Patent Office. When the Civil War began in 1861, she saw wounded soldiers arriving in Washington with nothing, and she began collecting bandages, food and medicine, paying for much of it herself. She refused to stay behind the lines. She badgered generals until they gave her passes to the front.\n\nIn August 1862, after the battle of Cedar Mountain, she arrived at a field hospital at midnight with a wagonload of supplies, and a surgeon wrote that if heaven ever sent out an angel, she must be one. A month later at Antietam, the bloodiest single day in American history, a bullet passed through her sleeve as she knelt beside a wounded man, killing him. She did not leave. In June 1864 she was formally appointed superintendent of nurses for the Army of the James.\n\nWhen the war ended, President Abraham Lincoln asked her to find the missing. Her Office of Missing Soldiers reunited more than 20,000 men with their families. In 1869, on a trip to Europe, she learned of the Red Cross, and on May 21, 1881, at the age of 59, she founded the American Red Cross, leading it for 23 years. She died in 1912, at 90, having spent a lifetime walking toward the sound of suffering. One woman, no army behind her, changed how America cares for its wounded."}];
var LS_KEY = 'us-history-tool-v1';
var state = { done: {}, copies: {}, deleted: {} };

function loadState() {
  try {
    var raw = localStorage.getItem(LS_KEY);
    if (raw) {
      var s = JSON.parse(raw);
      if (s && typeof s === 'object') {
        state.done = s.done || {};
        state.copies = s.copies || {};
        state.deleted = s.deleted || {};
      }
    }
  } catch (e) {}
}
function saveState() {
  try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {}
}

function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  setTimeout(function() { t.style.display = 'none'; }, 1800);
}

function copyText(text, btn) {
  function ok() {
    showToast('Caption copied');
    if (btn) {
      var old = btn.textContent;
      btn.textContent = 'Copied';
      setTimeout(function() { btn.textContent = old; }, 1600);
    }
  }
  function fallback() {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.left = '-9999px';
    ta.style.top = '0';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    var done = false;
    try { done = document.execCommand('copy'); } catch (e) { done = false; }
    document.body.removeChild(ta);
    if (done) { ok(); } else { showToast('Copy failed, hold and copy the caption text'); }
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(ok, fallback);
  } else {
    fallback();
  }
}

function downloadPhoto(post) {
  fetch(post.file).then(function(res) {
    if (!res.ok) { throw new Error('fetch failed'); }
    return res.blob();
  }).then(function(blob) {
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = post.file;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function() { URL.revokeObjectURL(url); }, 4000);
    showToast('Photo downloading');
  }).catch(function() {
    var a2 = document.createElement('a');
    a2.href = post.file;
    a2.download = post.file;
    document.body.appendChild(a2);
    a2.click();
    document.body.removeChild(a2);
    showToast('Photo downloading');
  });
}

function makeCard(post, isDone) {
  var card = document.createElement('div');
  card.className = 'card';

  var img = document.createElement('img');
  img.src = post.file;
  img.alt = post.title;
  card.appendChild(img);

  var body = document.createElement('div');
  body.className = 'card-body';

  var title = document.createElement('div');
  title.className = 'card-title';
  title.textContent = post.title;
  body.appendChild(title);

  var copies = document.createElement('div');
  copies.className = 'copies';
  var n = state.copies[post.id] || 0;
  copies.textContent = 'Caption copied ' + n + (n === 1 ? ' time' : ' times');
  body.appendChild(copies);

  var row = document.createElement('div');
  row.className = 'btnrow';

  var dl = document.createElement('button');
  dl.className = 'gold';
  dl.textContent = 'Download Photo';
  dl.onclick = function() { downloadPhoto(post); };
  row.appendChild(dl);

  var cp = document.createElement('button');
  cp.textContent = 'Copy Caption';
  cp.onclick = function() {
    state.copies[post.id] = (state.copies[post.id] || 0) + 1;
    saveState();
    copies.textContent = 'Caption copied ' + state.copies[post.id] + (state.copies[post.id] === 1 ? ' time' : ' times');
    copyText(post.story, cp);
  };
  row.appendChild(cp);

  var cap = document.createElement('div');
  cap.className = 'caption';
  cap.textContent = post.story;

  var sc = document.createElement('button');
  sc.textContent = 'Show Caption';
  sc.onclick = function() {
    if (cap.className.indexOf('open') >= 0) {
      cap.className = 'caption';
      sc.textContent = 'Show Caption';
    } else {
      cap.className = 'caption open';
      sc.textContent = 'Hide Caption';
    }
  };
  row.appendChild(sc);

  if (!isDone) {
    var dn = document.createElement('button');
    dn.className = 'done-btn';
    dn.textContent = 'Complete';
    dn.onclick = function() {
      if (dn.getAttribute('data-confirm') === '1') {
        state.done[post.id] = true;
        saveState();
        render();
        showToast('Post completed');
      } else {
        dn.setAttribute('data-confirm', '1');
        dn.textContent = 'Tap again to confirm';
        setTimeout(function() {
          dn.removeAttribute('data-confirm');
          dn.textContent = 'Complete';
        }, 3000);
      }
    };
    row.appendChild(dn);
  } else {
    var un = document.createElement('button');
    un.className = 'undo-btn';
    un.textContent = 'Undo';
    un.onclick = function() {
      delete state.done[post.id];
      saveState();
      render();
      showToast('Post moved back');
    };
    row.appendChild(un);
  }

  var del = document.createElement('button');
  del.className = 'delete-btn';
  del.textContent = 'Delete';
  del.onclick = function() {
    if (del.getAttribute('data-confirm') === '1') {
      state.deleted[post.id] = true;
      saveState();
      render();
      showToast('Post deleted');
    } else {
      del.setAttribute('data-confirm', '1');
      del.textContent = 'Tap again to delete';
      setTimeout(function() {
        del.removeAttribute('data-confirm');
        del.textContent = 'Delete';
      }, 3000);
    }
  };
  row.appendChild(del);

  body.appendChild(row);
  body.appendChild(cap);
  card.appendChild(body);
  return card;
}

function render() {
  var pending = document.getElementById('pending-list');
  var doneList = document.getElementById('done-list');
  pending.innerHTML = '';
  doneList.innerHTML = '';
  var doneCount = 0;
  var visibleCount = 0;
  for (var i = 0; i < POSTS.length; i++) {
    var p = POSTS[i];
    if (state.deleted[p.id]) { continue; }
    visibleCount++;
    if (state.done[p.id]) {
      doneList.appendChild(makeCard(p, true));
      doneCount++;
    } else {
      pending.appendChild(makeCard(p, false));
    }
  }
  document.getElementById('progress').textContent = doneCount + ' of ' + POSTS.length + ' completed';
  document.getElementById('pending-empty').style.display = (visibleCount > 0 && doneCount === visibleCount) ? 'block' : 'none';
  document.getElementById('done-empty').style.display = (doneCount === 0) ? 'block' : 'none';
}

loadState();
render();
</script>
</body>
</html>
