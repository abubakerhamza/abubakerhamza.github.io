<script>
var POSTS = [{"id": "post-01", "file": "post-01.png", "title": "The Wright Brothers First Flight, 1903", "story": "On the morning of 17 December 1903, the wind at Kitty Hawk, North Carolina, was bitter and gusting to 27 miles per hour. Two brothers from Dayton, Ohio, stood beside a strange machine of spruce wood, muslin cloth and wire. Wilbur and Orville Wright were bicycle mechanics. They had no university degrees, no wealthy backers and no government money. What they had was four years of patient experiments, a homemade wind tunnel, and a belief that they could solve the problem of flight that had defeated the finest minds in the world.\n\nOnly nine days earlier, Samuel Langley, one of America's most respected scientists, backed by 50,000 dollars of government money, had watched his great Aerodrome plunge into the Potomac River for the second time. The newspapers mocked him, and many experts declared that human flight was impossible.\n\nThe brothers had flipped a coin to decide who would try first. Wilbur won, but his attempt on 14 December ended in the sand. Now it was Orville's turn. At 10:35 in the morning, with five witnesses watching, the little engine coughed into life. Orville lay flat on the lower wing. Wilbur ran alongside, holding the wingtip steady, then let go.\n\nThe Flyer rose into the freezing wind. It dipped and climbed, dipped and climbed, and after 12 seconds it settled back onto the sand, 120 feet from where it had started. It was the first time in history that a powered machine had carried a man through the air under full control.\n\nThey flew three more times that day, each flight longer than the last. On the fourth, Wilbur stayed in the air for 59 seconds and covered 852 feet. Then a gust caught the machine on the ground and wrecked it, and the brothers walked back through the sand, knowing the world had changed forever."}, {"id": "post-02", "file": "post-02.png", "title": "Lincoln's Gettysburg Address, 1863", "story": "On 19 November 1863, some 15,000 people gathered at Gettysburg, Pennsylvania, to dedicate a cemetery for the Union soldiers who had died there four months earlier, in the bloodiest battle of the Civil War. The star of the day was not the President. Edward Everett, the most famous speaker in America, had been invited months in advance to deliver the main oration, and he did not disappoint. Standing before the crowd, he spoke for two full hours, more than 13,000 words delivered from memory, a grand performance in the style of the ancient Greeks.\n\nThen Abraham Lincoln rose. He had been asked, almost as an afterthought, to add a few appropriate remarks. He spoke for about two minutes. His address contained just 272 words, ten sentences, and when he sat down, many in the crowd were not sure the speech had even begun. A photographer had no time to capture him. Lincoln himself believed he had failed. The world will little note, nor long remember what we say here, he had said, and he feared it was true.\n\nHe was wrong. Within days, newspapers across the North were reprinting the address. Everett himself wrote to Lincoln the very next day with an extraordinary confession: I should be glad if I could flatter myself that I came as near to the central idea of the occasion in two hours as you did in two minutes.\n\nEverett's two-hour oration is remembered today only because of the letter he wrote about Lincoln's. The 272 words, beginning Four score and seven years ago and ending with the promise that government of the people, by the people, for the people shall not perish from the earth, became the most famous speech in American history, memorized by generations of schoolchildren and carved in stone on the wall of the Lincoln Memorial."}, {"id": "post-03", "file": "post-03.png", "title": "The Golden Gate Bridge Safety Net, 1937", "story": "In the 1930s, everyone in the bridge business knew the grim rule of thumb: for every million dollars spent on a great bridge, one worker would die. The Golden Gate Bridge in San Francisco was a 35 million dollar project, so the men who climbed its towers in 1933 expected that many of them would never come down alive. Falls from height were simply accepted as part of the job.\n\nChief engineer Joseph Strauss refused to accept it. He filled the site with safety rules that seem obvious today but were revolutionary then. His men had to wear hard hats, still a new invention. There were glare-free goggles against the blinding sun on the water, special creams to protect skin against the wind, and special diets to fight dizziness, because a dizzy man at 700 feet was a dead man. Anyone caught showing off or taking foolish risks was fired on the spot.\n\nHis boldest idea was a giant safety net, strung beneath the whole length of the bridge at a cost of about 130,000 dollars. Nothing like it had ever been tried on such a scale. Again and again during construction, the net proved its worth. Nineteen men slipped, fell, and landed in it alive. The grinning survivors gave themselves a name they wore with pride: the Halfway to Hell Club.\n\nThe net could not save everyone. In October 1936, one worker fell to his death. Then, on 17 February 1937, a heavy scaffold collapsed and tore through the net, carrying ten men into the bay. It was the bridge's darkest day. Yet when the Golden Gate opened in May 1937, the final toll stood at eleven lives on a project where the old rule had predicted thirty-five. The great net beneath the bridge had changed construction forever, and worker safety would never again be treated as an afterthought."}, {"id": "post-04", "file": "post-04.png", "title": "Washington Crosses the Delaware, 1776", "story": "By Christmas Day 1776, the American Revolution was nearly over, and not in America's favour. Washington's army had been driven out of New York, chased across New Jersey, and reduced to a few thousand cold, hungry men. Enlistments were about to expire. Many believed the cause was lost.\n\nWashington knew he needed one bold stroke, and he needed it now. His plan was audacious to the point of madness: cross the ice-choked Delaware River on Christmas night, in the middle of a nor'easter, and strike the Hessian garrison at Trenton at dawn.\n\nThe storm that night was brutal. Snow, sleet and freezing rain lashed the river, and sheets of ice ground against the boats. Washington led 2,400 men across, ferried through the darkness by Colonel John Glover's Marblehead sailors, fishermen who knew dangerous water better than any soldiers alive. With them came 18 artillery pieces, hauled aboard with enormous effort as horses slipped in the freezing wind.\n\nNothing went to plan. Two other American crossings planned for that night failed completely, beaten back by the ice and the storm. Washington's own column finished crossing hours late, with dawn dangerously close. A lesser commander might have turned back. Washington pressed on.\n\nHis men marched about nine miles through the snow toward Trenton, soaked and frozen. Then, at around eight in the morning, they struck. The Hessian troops, some 1,400 to 1,500 men who had celebrated Christmas and never expected an attack in such weather, were caught completely by surprise. Nearly 1,000 of them were captured. Remarkably, there were no American combat deaths.\n\nIt was a small battle by the numbers. In spirit, it was enormous. News of Trenton raced through the colonies like fire through dry grass. A cause that had seemed dead was suddenly alive again. Men re-enlisted. Hope returned. Washington had gambled everything on one freezing night, and that gamble saved the Revolution."}, {"id": "post-05", "file": "post-05.png", "title": "The Star-Spangled Banner, 1814", "story": "In the summer of 1813, Major George Armistead, commander of Fort McHenry in Baltimore, wanted a flag so big that the British would have no trouble seeing it from a distance. The job went to Mary Pickersgill, a Baltimore flagmaker who worked with her daughter and nieces, then laid the enormous banner out on the floor of a nearby brewery because no room she had was large enough.\n\nThe garrison flag she sewed measured 30 by 42 feet, with 15 stars and 15 stripes, one for each state in the young Union. It took weeks of work and more than 300 yards of cloth. No one yet knew it was about to become the most famous flag in American history.\n\nA year later, in September 1814, the British came for Baltimore. Fresh from burning Washington, their fleet moved into the harbour, and on 13 September the bombardment of Fort McHenry began. For 25 hours, through wind and driving rain, British warships hurled shells and rockets at the little fort. The rockets glared red in the night sky, and the bombs burst in air over the ramparts.\n\nWatching from a truce ship offshore was a young American lawyer named Francis Scott Key, who had come to negotiate the release of a prisoner. All night he paced and strained his eyes through the smoke and rain. As long as the firing continued, he knew the fort still held. But toward dawn, the guns fell silent, and in that terrible quiet he could not tell who had won.\n\nThen the morning light came. The storm cleared, the smoke lifted, and above Fort McHenry, Mary Pickersgill's great garrison flag was raised, broad and unbroken. The fort had held. Baltimore was saved.\n\nKey, overwhelmed, began writing a poem on the back of a letter. That poem became The Star-Spangled Banner, and in 1931 it was officially made the national anthem of the United States. The original flag is preserved today at the Smithsonian."}, {"id": "post-06", "file": "post-06.png", "title": "Harriet Tubman and the Combahee Raid, 1863", "story": "By 1863, Harriet Tubman was already a legend. She had escaped slavery herself and returned south again and again on the Underground Railroad to lead others to freedom, never losing a single passenger. But in South Carolina she took on a role no American woman had ever held before: she helped plan and guide a military raid.\n\nWorking as a scout and spy for the Union Army, Tubman built a network of informants among the enslaved people along the Combahee River. From them she learned what no Union map could show: exactly where the Confederates had planted underwater torpedoes, the mines that could blow a gunboat out of the water, and where the enslaved families lived.\n\nOn the night of 1 to 2 June 1863, three Union gunboats moved quietly up the Combahee. Tubman was aboard, guiding them past the hidden torpedoes with the intelligence she had gathered. With her were Colonel James Montgomery and the Black soldiers of the 2nd South Carolina regiment, many of them formerly enslaved men fighting for their own people's freedom.\n\nWhen the boats reached the shore, the scene was unforgettable. Enslaved people came running from the fields and cabins, carrying children and bundles, wading and scrambling toward the boats. Some plantation owners tried to stop them, but the people kept coming. The raiders burned rice plantations, mills and stores of supplies, striking a hard blow at the Confederate economy.\n\nIn a single night, more than 700 enslaved people were freed. Many of the freed men then enlisted in the Union Army themselves, taking up arms for the cause that had freed them.\n\nThe Combahee River Raid was the first American military operation planned and guided by a woman. Tubman, who could not read or write, had outwitted an army, saved the gunboats, and led hundreds of her people out of bondage in one moonlit night."}, {"id": "post-07", "file": "post-07.png", "title": "The Pony Express, 1860", "story": "On 3 April 1860, a rider burst out of St. Joseph, Missouri, at a full gallop, carrying a leather pouch of mail, and a legend rode with him. The Pony Express had begun, promising something Americans had never seen: a letter carried across the continent, from Missouri to Sacramento, California, in about ten days.\n\nThe distance was staggering, about 1,900 miles of prairie, desert, river crossings and mountain passes. A stagecoach needed more than three weeks to make the same journey. The Pony Express did it with a relay. Riders, mostly young men, galloped from station to station, changing horses every 10 to 15 miles at some 157 stations strung across the wilderness. A fresh horse, a quick swing into the saddle, and the mail was moving again, day and night, in all weather.\n\nIt was dangerous, lonely work. Riders crossed country where a broken leg or a sudden storm could mean death, and they rode through the territory of Native nations whose land the trail cut across. They were paid well for the time, but they earned every cent in the saddle.\n\nThe system's finest hour came in March 1861, when riders carried President Abraham Lincoln's inaugural address across the country in just 7 days and 17 hours, the fastest run in Pony Express history. Newspapers waited breathlessly for that speech as the nation slid toward civil war, and the riders delivered.\n\nYet the legend was brief. The Pony Express lasted only 18 months. In October 1861, the transcontinental telegraph was completed, and a message that had needed ten days of galloping horses could suddenly cross America in moments. The company shut down almost at once.\n\nBut those 18 months mattered. The Pony Express proved that a year-round cross-country system could work, through winter and summer alike. It bound California to the Union at the moment the nation was tearing apart, and its riders became one of the most enduring images of the American West."}, {"id": "post-08", "file": "post-08.png", "title": "The Statue of Liberty, 1886", "story": "She arrived in pieces. On 17 June 1885, the French frigate Isere sailed into New York Harbor carrying the most extraordinary gift one nation had ever given another. In her hold were 214 crates holding 350 separate pieces of the Statue of Liberty, sculpted in Paris by Frederic Auguste Bartholdi, with a hidden iron skeleton designed by Gustave Eiffel, the man who would soon give Paris its famous tower.\n\nIn France, crowds had walked inside her copper head and climbed into her torch. Now she lay dismantled on an American dock, and there was a serious problem. America had promised to build the pedestal she would stand on, and America had run out of money. The pedestal stood half finished on Bedloe's Island, workmen idle, and many wealthy donors refused to help. Some said the statue should go to Boston or Philadelphia instead.\n\nThen Joseph Pulitzer, publisher of the New York World, made the cause his own. He printed the name of every donor in his newspaper, however small the gift. Schoolchildren sent pennies. Workers sent dimes. A group of schoolgirls sent money they had saved for dolls. In about five months, more than 120,000 ordinary people gave, most of them less than a dollar, and the pedestal fund was full.\n\nPiece by piece, workers riveted her copper skin onto Eiffel's iron frame, high above the harbour. On 28 October 1886, in pouring rain, President Grover Cleveland dedicated her before a million spectators. Ships fired their guns, whistles screamed, and Bartholdi himself, waiting high inside the crown, pulled the rope that dropped the French flag from her face.\n\nShe stands 151 feet tall, and 305 feet from the ground to the tip of her torch. She was France's gift, but ordinary Americans paid to give her a place to stand, and she has welcomed the world ever since."}, {"id": "post-09", "file": "post-09.png", "title": "The Golden Spike, 1869", "story": "It began with a bet. The bosses of the two railroads racing to join America together had wagered 10,000 dollars on whose crews could lay the most track in a single day. The Union Pacific had set the mark at eight miles. On 28 April 1869, the Central Pacific answered.\n\nAt dawn in Utah, an extraordinary team went to work. Eight Irish rail handlers did the heaviest lifting, placing the rails, backed by thousands of Chinese workers who had blasted tunnels through the Sierra Nevada and survived winters of snow to bring the line this far. Behind the Irishmen came spikers, bolters and men carrying ties and iron in a perfectly drilled human machine. A train rolled forward a few feet at a time, and the track grew beneath it almost as fast as a man could walk.\n\nThey stopped only briefly for lunch. By evening they had laid 10 miles and 56 feet of track in under 12 hours. It was, and still is, the greatest feat of hand-laid track in history. Each of the eight Irishmen had lifted rails weighing hundreds of pounds, mile after mile, and their names were remembered when many executives were forgotten.\n\nTwelve days later, on 10 May 1869, at Promontory Summit, Utah, the two roads finally met. The Central Pacific had built 690 miles east from Sacramento. The Union Pacific had built 1,086 miles west from Omaha. Together they made 1,776 miles of unbroken rail. A golden spike was driven to join the final rails, and the telegraph carried one word across the nation: Done.\n\nBefore that day, crossing America took months of danger by wagon or ship. Now the journey took about a week. Two locomotives touched noses, engineers shook hands, and a continent that had been divided by distance became, at last, one country joined by iron."}, {"id": "post-10", "file": "post-10.png", "title": "The Apollo 13 Rescue, 1970", "story": "Apollo 13 was supposed to be routine. Launched on 11 April 1970, it carried Jim Lovell, Jack Swigert and Fred Haise toward the Moon, and most of America barely watched. Two landings had already succeeded. Spaceflight, people thought, had become safe.\n\nThen, about 56 hours into the flight, on 13 April, an oxygen tank exploded. The spacecraft shuddered, warning lights flooded the panel, and Swigert spoke the calmest famous words in space history, telling Houston they had had a problem. They were about 200,000 miles from Earth, losing oxygen and power, and the Moon landing was gone in an instant. The only question now was whether three men would live.\n\nThe crew crowded into the lunar module Aquarius. It had been built to carry two men for two days. Now it had to keep three men alive for four. It became their lifeboat, cold and dark, its power rationed, water strictly measured, the walls dripping with condensation. Lovell, on his fourth spaceflight, would never walk on the Moon. Instead he had to bring his crew home around it, using its gravity as a slingshot.\n\nIn Houston, Mission Control improvised around the clock. Flight controllers and engineers emptied a flight kit onto a table and solved an impossible puzzle: how to fit the command module's square carbon dioxide filters into the lunar module's round holes, using only plastic bags, cardboard, tape and flight sock covers. The crew built exactly what the engineers described, and the air slowly cleared.\n\nOn 17 April 1970, after a silent, terrifying re-entry blackout that lasted longer than expected, three parachutes bloomed over the Pacific. All three men splashed down safely. NASA calls Apollo 13 its successful failure, a mission that reached no Moon, yet showed what human calm, teamwork and ingenuity can do when everything goes wrong."}, {"id": "post-11", "file": "post-11.png", "title": "D-Day, The Longest Day, 1944", "story": "Before dawn on 6 June 1944, the sea off Normandy, France, filled with ships as far as the eye could see. It was D-Day, the largest seaborne invasion in history. Some 7,000 vessels had crossed the Channel in darkness, carrying about 156,000 Allied troops toward five beaches with code names that the world would never forget: Utah, Omaha, Gold, Juno and Sword.\n\nThe invasion had begun in the night. About 24,000 paratroopers and glider troops dropped behind enemy lines in the darkness, alone, scattered, fighting to seize bridges and roads before the landings began. Many drowned in flooded fields or landed miles from their targets, and fought anyway.\n\nGeneral Dwight Eisenhower had written two messages. One announced the landings. The other, kept in his pocket, took all the blame on himself if they failed. To the men he said simply that the eyes of the world were upon them, and that they would accept nothing less than full victory. Then the ramps went down.\n\nAt Omaha Beach, the fighting was fiercest. Soldiers leapt into deep water under heavy fire, many dragged down by their own equipment. Obstacles tore at the landing craft, and the cliffs above poured fire onto the sand. Unit after unit was shattered, yet small groups of survivors climbed the bluffs on their own initiative, and by nightfall the beach was held. More than 4,400 Allied troops died that single day.\n\nThey were, most of them, very young, far from home, and they knew the odds when the ramp dropped. By sunset, the Allies held a foothold in France that Hitler's armies could never throw back into the sea. The road to liberate Europe was open, and it had been paid for, yard by yard, by ordinary men who refused to turn back."}, {"id": "post-12", "file": "post-12.png", "title": "The Declaration of Independence, 1776", "story": "In the summer of 1776, Philadelphia was hot, tense and watched by the most powerful empire on earth. Inside a plain brick hall, representatives of thirteen colonies were about to do something that could get every one of them hanged. On 4 July, Congress adopted the Declaration of Independence, a document that announced to the world that these colonies were free, and that all men are created equal.\n\nThe man who drafted it was not an elder statesman. Thomas Jefferson was just 33 years old, a quiet Virginian chosen because his pen could turn anger into poetry. He wrote of rights no king could give and no king could take away, and his words gave a scattered rebellion a soul.\n\nBut words on paper were only the beginning. To sign the Declaration was to commit treason against the British Crown, and treason meant the gallows. The men who stepped forward knew exactly what the rope would feel like if the war was lost. Most of the 56 delegates signed on 2 August 1776, each name an open confession, each signature a target painted on a family.\n\nJohn Hancock, the president of Congress, signed first, and he signed largest of all. As the famous story goes, he wanted King George to be able to read his name without spectacles. It was defiance with a flourish, the handwriting of a man who refused to whisper.\n\nThe document ends with a promise the signers made to one another: they pledged their lives, their fortunes and their sacred honor. Many of them would indeed lose fortunes, homes and health in the war that followed. Yet they signed anyway, believing that freedom was worth the price of everything they owned, including their own lives."}, {"id": "post-13", "file": "post-13.png", "title": "The March on Washington, 1963", "story": "On 28 August 1963, they came to Washington by bus, by train, by car and on foot. About 250,000 people, Black and white together, filled the National Mall for the March on Washington for Jobs and Freedom. They were teachers and factory workers, church grandmothers and students, maids and ministers, and they came carrying a simple demand: that America finally keep its promises to all of its people.\n\nThe day was peaceful, almost joyful, a sea of people stretching along the Reflecting Pool in the warm afternoon light. Families shared sandwiches on the grass. Strangers linked arms. From the steps of the Lincoln Memorial, speaker after speaker called for work, for dignity and for the right to vote without fear.\n\nThen Dr Martin Luther King Jr stepped to the microphone. He was 34 years old, and he began with a prepared speech about a bad check, a promise America had defaulted on. But behind him, the great gospel singer Mahalia Jackson, who had sung earlier that day, called out to him: Tell them about the dream, Martin.\n\nKing set his notes aside. What followed was not read, it was poured out, a preacher speaking of a dream rooted in the American dream itself, of children judged by the content of their character, of freedom ringing from every mountainside. The crowd swayed and answered him like a congregation.\n\nThe march did not change the law that day, but it changed the conscience of a nation watching on television. Within a year, the Civil Rights Act of 1964 became law, and the Voting Rights Act followed in 1965. The dream spoken at Lincoln's feet had moved a country closer to becoming what it claimed to be."}, {"id": "post-14", "file": "post-14.png", "title": "Amelia Earhart Flies the Atlantic Alone, 1932", "story": "Before dawn on 20 May 1932, a red Lockheed Vega rolled down a rough field at Harbour Grace, Newfoundland, lifted into the cold Atlantic air, and pointed its nose toward Ireland. At the controls, entirely alone, sat Amelia Earhart. She was attempting what only one person, Charles Lindbergh, had ever done before: to fly the Atlantic Ocean solo and nonstop. No woman had ever done it. Many believed no woman could.\n\nThe flight quickly became a battle. Storms threw the little plane around the sky. Ice crept over the wings, weighing her down and forcing her lower toward the waves. A fuel tank leaked. Worst of all, the exhaust manifold cracked, and flames began streaming back along the fuselage, close to that leaking fuel. She had no radio contact with anyone. There was no one to call, no one to rescue her, only the roar of the engine and her own steady hands.\n\nFor 14 hours and 56 minutes she flew through darkness, weather and fear, navigating by skill and instinct. Then, at last, green fields appeared below. She brought the Vega down in a farmer's pasture at Culmore, in Northern Ireland, startling the man who came out to stare at the woman who had fallen out of the sky from America.\n\nOvernight, Earhart became a hero on both sides of the ocean, proof that courage did not belong to one sex. She used her fame to open doors for other women who wanted to fly.\n\nFive years later, in 1937, she vanished over the Pacific while attempting to fly around the world. Her final flight remains one of history's great mysteries, but the Atlantic crossing endures: one woman, one red airplane, and an ocean crossed alone."}, {"id": "post-15", "file": "post-15.png", "title": "Ellis Island, The Gateway to America, 1892", "story": "On New Year's Day, 1 January 1892, a new federal immigration station opened on a small island in New York Harbor. The first person to walk through its doors was not a wealthy merchant or a famous name. She was Annie Moore, a 15-year-old girl from Ireland, arriving with her two younger brothers to join their parents in America. Officials marked the moment by presenting her with a $10 gold piece, and a statue of her still stands there today.\n\nAnnie was the first of a multitude. Over the next six decades, nearly 12 million immigrants were processed in the island's vast Great Hall, beneath its soaring arched windows. They arrived with bundles, suitcases and cardboard tags pinned to their coats, speaking languages from every corner of Europe and beyond, carrying almost nothing except hope.\n\nThe Great Hall could be a place of terror as well as welcome. Doctors watched newcomers climb the stairs, looking for the weak and the lame, and marked the suspect with chalk letters on their coats. The famous six-second health check could decide a family's fate. To fail could mean being sent back across the ocean alone, watching the promised land disappear behind the ship.\n\nMost passed through in a matter of hours, bought a ferry ticket and stepped into their new lives. The busiest day came on 17 April 1907, when 11,747 people were processed in a single day, an unending river of humanity flowing through one hall.\n\nToday, tens of millions of Americans can trace their families back to those lines at Ellis Island. Their surnames fill phone books, their foods fill American tables, and their story, beginning with a 15-year-old Irish girl, became the story of America itself."}, {"id": "post-16", "file": "post-16.png", "title": "The Boston Tea Party, 1773", "story": "On the night of 16 December 1773, Boston was quiet, cold, and waiting. For weeks, three ships had sat at Griffin's Wharf loaded with tea from the East India Company, and the whole town understood what that tea really meant. Under the British Tea Act, colonists would pay a tax they had never voted for, to a Parliament an ocean away where no American voice was heard. Taxation without representation, they called it, and they refused to swallow it with their tea.\n\nThat evening, after a huge meeting failed to send the ships home, members of the Sons of Liberty moved through the darkness. Some had thinly disguised themselves as Mohawk Indians, smearing their faces and wrapping themselves in blankets, not to fool anyone for long, but to declare that they were Americans now, not British subjects.\n\nThey boarded the Dartmouth, the Eleanor, and the Beaver. What followed was not a riot. It was disciplined, almost silent work. For about three hours, by lantern light, the men hauled chest after chest up from the holds, smashed them open with axes, and poured the tea into the harbour. In all, 342 chests went into the black water. They harmed no one. They damaged nothing else. One padlock that was broken was replaced the next day, and the decks were swept clean before the men vanished into the night.\n\nBy morning, tea washed along the Boston shoreline like a strange brown tide, and the news raced through the colonies. London answered with fury. Britain's punishment, the Coercive Acts, closed Boston's port, tightened military control, and squeezed the very people Britain hoped to frighten into obedience.\n\nIt had the opposite effect. Colonies that had argued among themselves now stood together. Committees formed, militias drilled, and trust in the Crown drained away. The harbour that night had smelled of tea. Within sixteen months, at Lexington and Concord, it would smell of gunpowder, and a revolution would begin."}, {"id": "post-17", "file": "post-17.png", "title": "Pearl Harbor, 1941", "story": "Sunday morning, 7 December 1941, began gently at Pearl Harbor, Hawaii. Sailors were raising flags, bands were preparing to play, and many young men were still asleep aboard the great battleships moored along Battleship Row. At 7:55 a.m., that peace ended. Japanese aircraft swept in without warning, torpedoes cutting through the harbour and bombs falling on ships and airfields across Oahu.\n\nIn minutes, the Pacific Fleet was burning. Battleships were hit one after another, hundreds of aircraft were destroyed on the ground before they could ever take off, and eight battleships were damaged or sunk. The worst loss came aboard the USS Arizona. A bomb struck her forward magazine, and the ship erupted in a towering explosion, sinking where she lay. Of the men aboard her, 1,177 were killed, nearly half of all the Americans who died that morning.\n\nBy the time the second wave of attackers turned for home, 2,403 Americans were dead. They were sailors, soldiers, Marines, and civilians, many of them teenagers far from home, whose names are now carved in white marble above the harbour water. The Arizona still rests where she sank, and small drops of oil still rise from her hull, which survivors called her black tears. Above her wreck stretches a white memorial, quiet and bright in the Hawaiian sun.\n\nThe next day, President Franklin D. Roosevelt stood before Congress and a stunned nation. Yesterday, he said, December 7, 1941, a date which will live in infamy, the United States was suddenly and deliberately attacked. Within the hour, America had declared war on Japan. Within days, it was at war with Germany and Italy as well.\n\nA divided country became one country overnight. Recruiting lines wrapped around city blocks. Pearl Harbor was not only a defeat. It was the morning America woke up, and the Second World War changed forever."}, {"id": "post-18", "file": "post-18.png", "title": "Women Win the Vote, 1920", "story": "In 1848, in the small town of Seneca Falls, New York, Elizabeth Cady Stanton and Lucretia Mott helped gather a convention that made a shocking demand: women should have the right to vote. Many newspapers mocked them. Most politicians ignored them. But the women who signed that declaration understood they had started something that could not be stopped, even if it took longer than their own lifetimes.\n\nIt did. Generation after generation picked up the cause. Susan B. Anthony devoted her life to it, travelling, speaking, and organizing when few would listen. In 1872, she walked into a polling place in Rochester and cast a ballot in the presidential election. She was arrested, tried, and fined, and she refused to pay. The fine was never collected, but neither was her vote ever counted.\n\nYounger women marched where their grandmothers had only been allowed to petition. They filled grand parades in white dresses, stood as silent sentinels outside the White House, were arrested for picketing, and in prison went on hunger strikes. Alice Paul and Lucy Burns and thousands of women whose names history barely kept endured ridicule and force because they believed a simple truth: a democracy that silenced half its people was not finished yet.\n\nBy the summer of 1920, the 19th Amendment had passed Congress and needed one final state. Thirty-five had ratified it. Tennessee would decide. In the state capitol, the vote was deadlocked, until 24-year-old legislator Harry Burn opened a letter from his mother back home in Niota. She told him to be a good boy and help Mrs. Catt put the rat in ratification. Burn changed his vote.\n\nThe amendment was ratified on 18 August 1920 and certified on 26 August. After 72 years, American women had won the vote, just in time to cast ballots that November."}, {"id": "post-19", "file": "post-19.png", "title": "The Berlin Airlift, 1948", "story": "On 24 June 1948, the people of West Berlin woke to a silent city. The Soviet Union had blocked every road, railway, and canal leading into the western half of the city, cutting it off from the outside world. More than two million people were trapped inside, with food running out, coal running out, and winter already on every mind. The blockade was meant to starve West Berlin into surrender without firing a single shot.\n\nThe Western Allies refused to abandon it. If nothing could reach Berlin by land, everything would come by air. Operation Vittles began on 26 June 1948, and American and British aircraft began the most extraordinary delivery service in history. Flour, milk, potatoes, medicine, and coal, all of it arrived in the bellies of cargo planes landing at Tempelhof and other airfields, around the clock, in fog, rain, and snow.\n\nAt the peak, a plane was landing every few minutes, sometimes even faster, and ground crews raced to unload each one in minutes so it could take off again. Over the whole operation, the airlift flew more than 277,000 flights and delivered 2.3 million tons of food, fuel, and supplies. Berliners, who had recently been enemies, worked beside the airmen, unloading sacks by hand through the night.\n\nOne pilot became beloved by the city's children. Gail Halvorsen had been giving his gum and chocolate to children watching at the fence, and he promised them more, dropped from the sky. Soon he was tying candy to tiny handkerchief parachutes and wiggling his wings so the children would know his plane. The Candy Bomber, they called him, and his little parachutes became a symbol of hope falling gently over a hungry city.\n\nThe Soviets lifted the blockade on 12 May 1949, but the flights continued until 30 September 1949, building a reserve. A city had been kept alive from the air."}, {"id": "post-20", "file": "post-20.png", "title": "Lindbergh Flies to Paris Alone, 1927", "story": "Before dawn on 20 May 1927, a silver aeroplane sat at the end of a muddy runway at Roosevelt Field, New York, heavy with fuel and pointed at an ocean. In the cockpit sat Charles Lindbergh, a 25-year-old airmail pilot almost nobody had heard of. He was about to attempt something that had already killed several brave men: a nonstop flight, alone, from New York to Paris, chasing the $25,000 Orteig Prize.\n\nHis plane, the Spirit of St. Louis, was a single-engine monoplane built around one idea: weight is the enemy. Lindbergh carried no radio, because a radio was heavy. He carried no parachute, for the same reason. His sandwiches and water were counted like cargo. The fuel tanks sat in front of him, so large that he could not see straight ahead and had to peer through a small periscope or lean out the side window.\n\nRain had soaked the field, and the overloaded plane struggled down the runway, clearing telephone wires by only a few feet. Then he was alone over grey water, in fog and darkness, with nothing but a compass, his charts, and his own stubborn wakefulness. Ice formed on the wings. Sleep pressed on him like a physical weight, and at times he flew barely above the waves, hoping the cold salt spray would keep him awake. He had been flying all night and all the night before that, with almost no rest.\n\nThen, off Ireland, he spotted fishing boats, leaned down, and shouted a question no one could hear: which way is Ireland? He found the coast, crossed England and the Channel, and followed the lights toward Paris. At Le Bourget, a vast crowd was waiting in the dark. After about 3,600 miles and 33 hours and 30 minutes in the air, the Spirit of St. Louis touched French soil, and the crowd surged forward and lifted the exhausted young pilot onto their shoulders. Overnight, he was the most famous man alive."}, {"id": "post-21", "file": "post-21.png", "title": "The Alamo, 1836", "story": "On the morning of 23 February 1836, lookouts on the walls of the Alamo mission in San Antonio saw dust on the horizon. General Antonio Lopez de Santa Anna had arrived with his Mexican army, and the siege of the Alamo had begun. Inside the old Spanish mission stood fewer than 200 Texian and Tejano volunteers under two young commanders, William Travis and James Bowie, and among them the famous frontiersman Davy Crockett, who had arrived from Tennessee with a dozen men.\n\nTravis knew no help was coming in time. On 24 February he wrote the letter that became one of the most famous in American history, addressed \"To the People of Texas and All Americans in the World\". He promised victory or death, and he asked for reinforcements. Only 32 men from the town of Gonzales managed to slip through the Mexican lines to join him.\n\nFor 13 days the Mexican guns pounded the crumbling walls. The defenders answered with their rifles, and by most accounts they killed or wounded 400 to 600 of Santa Anna's men. Then, before dawn on 6 March, the Mexican army stormed the walls in four columns. After repelling two attacks, the Texians were overwhelmed. Within an hour, every defender inside was dead, including Travis, Bowie and Crockett. The women and children were spared.\n\nSanta Anna believed the slaughter would crush the rebellion. He was wrong. The names of the dead became a battle cry, and six weeks later, on 21 April, Sam Houston's army charged the Mexican camp at San Jacinto shouting \"Remember the Alamo!\" In 18 minutes the battle was over, Santa Anna was captured, and Texas was free. The men who died at the Alamo had bought that victory with their lives."}, {"id": "post-22", "file": "post-22.png", "title": "Sacagawea and the Lewis and Clark Expedition, 1805", "story": "In the winter of 1804, at a trading post called Fort Mandan on the upper Missouri River, two American explorers made the best decision of their expedition. Meriwether Lewis and William Clark had been sent by President Thomas Jefferson to find a way across the continent to the Pacific Ocean, and they needed someone who could talk to the Shoshone people and buy horses for the crossing of the Rocky Mountains. They hired a French-Canadian fur trader named Toussaint Charbonneau, and with him came his young Shoshone wife, Sacagawea. She was about sixteen years old, and she was pregnant.\n\nOn 11 February 1805, Sacagawea gave birth to a baby boy, Jean Baptiste, whom the men nicknamed Little Pomp. Two months later, on 7 April, the expedition set out up the Missouri in canoes, and Sacagawea went with them, her baby strapped to her back. Over the months that followed she proved herself again and again. She found edible plants when the men were hungry, she made moccasins and clothing, and when a canoe overturned she calmly saved the journals and instruments while the men panicked. Because a woman and a baby travelled with the party, the tribes they met knew at once that this was not a war party, and they were welcomed instead of attacked.\n\nIn the mountains, her knowledge saved the expedition a second time. She recognised the country of her childhood, she found the Shoshone and persuaded them to sell horses, and she guided the party through the passes to the Pacific, which they reached in November 1805. They spent the winter at the coast and returned to Fort Mandan in August 1806, having travelled more than 7,000 miles in all. Sacagawea had carried her son about 4,500 of those miles. Without her, the expedition that mapped America might never have come home."}];
var LS_KEY = 'us-history-tool-v1';
var state = { done: {}, copies: {}, deleted: {} };

function loadState() {
  try {
    var raw = localStorage.getItem(LS_KEY);
    if (raw) {
      var s = JSON.parse(raw);
      if (s && typeof s === 'object') {
        state.done = s.done || {};
        state.copies = s.copies || {};
        state.deleted = s.deleted || {};
      }
    }
  } catch (e) {}
}
function saveState() {
  try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {}
}

function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  setTimeout(function() { t.style.display = 'none'; }, 1800);
}

function copyText(text, btn) {
  function ok() {
    showToast('Caption copied');
    if (btn) {
      var old = btn.textContent;
      btn.textContent = 'Copied';
      setTimeout(function() { btn.textContent = old; }, 1600);
    }
  }
  function fallback() {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.left = '-9999px';
    ta.style.top = '0';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    var done = false;
    try { done = document.execCommand('copy'); } catch (e) { done = false; }
    document.body.removeChild(ta);
    if (done) { ok(); } else { showToast('Copy failed, hold and copy the caption text'); }
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(ok, fallback);
  } else {
    fallback();
  }
}

function downloadPhoto(post) {
  fetch(post.file).then(function(res) {
    if (!res.ok) { throw new Error('fetch failed'); }
    return res.blob();
  }).then(function(blob) {
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = post.file;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function() { URL.revokeObjectURL(url); }, 4000);
    showToast('Photo downloading');
  }).catch(function() {
    var a2 = document.createElement('a');
    a2.href = post.file;
    a2.download = post.file;
    document.body.appendChild(a2);
    a2.click();
    document.body.removeChild(a2);
    showToast('Photo downloading');
  });
}

function makeCard(post, isDone) {
  var card = document.createElement('div');
  card.className = 'card';

  var img = document.createElement('img');
  img.src = post.file;
  img.alt = post.title;
  card.appendChild(img);

  var body = document.createElement('div');
  body.className = 'card-body';

  var title = document.createElement('div');
  title.className = 'card-title';
  title.textContent = post.title;
  body.appendChild(title);

  var copies = document.createElement('div');
  copies.className = 'copies';
  var n = state.copies[post.id] || 0;
  copies.textContent = 'Caption copied ' + n + (n === 1 ? ' time' : ' times');
  body.appendChild(copies);

  var row = document.createElement('div');
  row.className = 'btnrow';

  var dl = document.createElement('button');
  dl.className = 'gold';
  dl.textContent = 'Download Photo';
  dl.onclick = function() { downloadPhoto(post); };
  row.appendChild(dl);

  var cp = document.createElement('button');
  cp.textContent = 'Copy Caption';
  cp.onclick = function() {
    state.copies[post.id] = (state.copies[post.id] || 0) + 1;
    saveState();
    copies.textContent = 'Caption copied ' + state.copies[post.id] + (state.copies[post.id] === 1 ? ' time' : ' times');
    copyText(post.story, cp);
  };
  row.appendChild(cp);

  var cap = document.createElement('div');
  cap.className = 'caption';
  cap.textContent = post.story;

  var sc = document.createElement('button');
  sc.textContent = 'Show Caption';
  sc.onclick = function() {
    if (cap.className.indexOf('open') >= 0) {
      cap.className = 'caption';
      sc.textContent = 'Show Caption';
    } else {
      cap.className = 'caption open';
      sc.textContent = 'Hide Caption';
    }
  };
  row.appendChild(sc);

  if (!isDone) {
    var dn = document.createElement('button');
    dn.className = 'done-btn';
    dn.textContent = 'Complete';
    dn.onclick = function() {
      if (dn.getAttribute('data-confirm') === '1') {
        state.done[post.id] = true;
        saveState();
        render();
        showToast('Post completed');
      } else {
        dn.setAttribute('data-confirm', '1');
        dn.textContent = 'Tap again to confirm';
        setTimeout(function() {
          dn.removeAttribute('data-confirm');
          dn.textContent = 'Complete';
        }, 3000);
      }
    };
    row.appendChild(dn);
  } else {
    var un = document.createElement('button');
    un.className = 'undo-btn';
    un.textContent = 'Undo';
    un.onclick = function() {
      delete state.done[post.id];
      saveState();
      render();
      showToast('Post moved back');
    };
    row.appendChild(un);
  }

  var del = document.createElement('button');
  del.className = 'delete-btn';
  del.textContent = 'Delete';
  del.onclick = function() {
    if (del.getAttribute('data-confirm') === '1') {
      state.deleted[post.id] = true;
      saveState();
      render();
      showToast('Post deleted');
    } else {
      del.setAttribute('data-confirm', '1');
      del.textContent = 'Tap again to delete';
      setTimeout(function() {
        del.removeAttribute('data-confirm');
        del.textContent = 'Delete';
      }, 3000);
    }
  };
  row.appendChild(del);

  body.appendChild(row);
  body.appendChild(cap);
  card.appendChild(body);
  return card;
}

function render() {
  var pending = document.getElementById('pending-list');
  var doneList = document.getElementById('done-list');
  pending.innerHTML = '';
  doneList.innerHTML = '';
  var doneCount = 0;
  var visibleCount = 0;
  for (var i = 0; i < POSTS.length; i++) {
    var p = POSTS[i];
    if (state.deleted[p.id]) { continue; }
    visibleCount++;
    if (state.done[p.id]) {
      doneList.appendChild(makeCard(p, true));
      doneCount++;
    } else {
      pending.appendChild(makeCard(p, false));
    }
  }
  document.getElementById('progress').textContent = doneCount + ' of ' + POSTS.length + ' completed';
  document.getElementById('pending-empty').style.display = (visibleCount > 0 && doneCount === visibleCount) ? 'block' : 'none';
  document.getElementById('done-empty').style.display = (doneCount === 0) ? 'block' : 'none';
}

loadState();
render();
</script>
</body>
</html>
