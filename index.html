<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>US History Posts</title>
<link rel="icon" href="cartoon.webp">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: #0A0A0A;
    background-image: radial-gradient(ellipse 900px 480px at 50% -80px, rgba(201,162,39,0.14), rgba(10,10,10,0) 70%);
    color: #F7F3E9;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    padding: 28px 16px 0;
    min-height: 100vh;
  }
  .wrap { max-width: 1160px; margin: 0 auto; }

  /* ---------- Header ---------- */
  header.site-head {
    display: flex; align-items: center; gap: 28px;
    padding: 10px 6px 26px;
  }
  .cartoon-frame {
    flex: 0 0 auto;
    width: 172px; height: 180px;
    border-radius: 26px;
    border: 3px solid #C9A227;
    overflow: hidden;
    background: #0d0b06;
    box-shadow: 0 0 0 5px rgba(201,162,39,0.12), 0 0 34px rgba(255,201,60,0.28), 0 14px 34px rgba(0,0,0,0.65);
    animation: floaty 4.2s ease-in-out infinite, glowPulse 4.2s ease-in-out infinite;
  }
  .cartoon-frame img { width: 100%; height: 100%; object-fit: cover; display: block; }
  @keyframes floaty {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-7px); }
  }
  @keyframes glowPulse {
    0%, 100% { box-shadow: 0 0 0 5px rgba(201,162,39,0.12), 0 0 26px rgba(255,201,60,0.20), 0 14px 34px rgba(0,0,0,0.65); }
    50% { box-shadow: 0 0 0 6px rgba(201,162,39,0.20), 0 0 46px rgba(255,201,60,0.42), 0 20px 38px rgba(0,0,0,0.65); }
  }
  .head-text { flex: 1 1 auto; min-width: 0; }
  h1 {
    font-family: Georgia, 'Playfair Display', 'Times New Roman', serif;
    font-size: 46px; line-height: 1.08; font-weight: bold;
    color: #F7F3E9; letter-spacing: 0.5px;
  }
  h1 .gold { color: #FFC93C; }
  .tagline {
    margin-top: 8px; font-size: 17px; color: #cfc8b8; letter-spacing: 0.4px;
  }
  .progress {
    display: inline-block; margin-top: 16px;
    font-size: 15px; font-weight: 600; color: #FFC93C;
    background: #171410; border: 1px solid #C9A227; border-radius: 999px;
    padding: 8px 18px; letter-spacing: 0.3px;
  }
  .gold-rule { height: 2px; background: linear-gradient(90deg, rgba(201,162,39,0), #C9A227 18%, #FFC93C 50%, #C9A227 82%, rgba(201,162,39,0)); border: 0; margin: 2px 0 6px; }

  /* ---------- Sections ---------- */
  h2.section {
    font-family: Georgia, 'Playfair Display', 'Times New Roman', serif;
    font-size: 24px; color: #FFC93C; letter-spacing: 0.4px;
    margin: 26px 0 14px; padding-bottom: 8px;
    border-bottom: 1px solid #2c2c2c;
  }
  .grid { display: grid; grid-template-columns: 1fr; gap: 26px; }
  @media (min-width: 980px) { .grid { grid-template-columns: 1fr 1fr; } }

  /* ---------- Cards ---------- */
  .card {
    background: linear-gradient(180deg, #171717, #101010);
    border: 1px solid #2e2e2e; border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 10px 30px rgba(0,0,0,0.55);
  }
  .card img { width: 100%; height: auto; display: block; border-bottom: 3px solid #C9A227; }
  .card-body { padding: 16px 18px 18px; }
  .card-title {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 21px; font-weight: bold; line-height: 1.3; margin-bottom: 5px;
  }
  .copies { font-size: 13.5px; color: #bdb6a4; margin-bottom: 13px; }
  .btnrow { display: flex; flex-wrap: wrap; gap: 10px; }
  button {
    font-family: inherit; font-size: 16px; font-weight: 600;
    min-height: 50px; padding: 12px 18px;
    border-radius: 10px; border: 1px solid #C9A227;
    background: #1f1f1f; color: #F7F3E9; cursor: pointer;
    transition: transform 0.08s ease, opacity 0.15s ease, background 0.15s ease;
  }
  button:hover { background: #262626; }
  button:active { opacity: 0.85; transform: scale(0.98); }
  button.gold { background: linear-gradient(180deg, #FFC93C, #f0b41f); color: #0A0A0A; border-color: #FFC93C; }
  button.gold:hover { background: linear-gradient(180deg, #ffd35c, #FFC93C); }
  button.done-btn { background: #24512a; border-color: #4a8a4a; color: #F7F3E9; }
  button.done-btn:hover { background: #2b6132; }
  button.undo-btn { background: #55262a; border-color: #8a4a4a; color: #F7F3E9; }
  button.undo-btn:hover { background: #653035; }
  button.delete-btn { background: #7f1d1d; border-color: #c04545; color: #F7F3E9; }
  button.delete-btn:hover { background: #991f1f; }
  .caption {
    display: none; margin-top: 14px;
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 15.5px; line-height: 1.65; white-space: pre-wrap;
    background: #0b0b0b; border: 1px solid #2c2c2c; border-radius: 10px; padding: 14px 16px;
  }
  .caption.open { display: block; }
  .empty { font-size: 15.5px; color: #bdb6a4; padding: 4px 0 16px; }

  /* ---------- Footer ---------- */
  footer.site-foot {
    margin-top: 44px; padding: 22px 10px 30px;
    border-top: 1px solid #2c2c2c; text-align: center;
  }
  footer.site-foot .credit {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 17px; color: #F7F3E9; letter-spacing: 0.4px;
  }
  footer.site-foot .credit .gold { color: #FFC93C; }

  #toast {
    position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%);
    background: #FFC93C; color: #0A0A0A; font-size: 16px; font-weight: bold;
    padding: 12px 22px; border-radius: 24px; display: none; z-index: 99;
    box-shadow: 0 4px 14px rgba(0,0,0,0.6); max-width: 92vw; text-align: center;
  }

  /* ---------- Mobile ---------- */
  @media (max-width: 640px) {
    body { padding: 20px 12px 0; }
    header.site-head { flex-direction: column; text-align: center; gap: 18px; padding-bottom: 20px; }
    .cartoon-frame { width: 152px; height: 159px; }
    h1 { font-size: 34px; }
    .tagline { font-size: 15.5px; }
    .card-body { padding: 14px 14px 16px; }
    .card-title { font-size: 19px; }
    button { flex: 1 1 auto; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="site-head">
    <div class="cartoon-frame">
      <img src="cartoon-anim.webp" onerror="this.onerror=null;this.src='cartoon.webp';" alt="Cartoon portrait of Muhammad Abubaker Hamza">
    </div>
    <div class="head-text">
      <h1>US <span class="gold">History</span> Posts</h1>
      <div class="tagline">Daily stories from America's past</div>
      <div class="progress" id="progress">0 of 20 completed</div>
      <a href="texts.html" style="display:inline-block; margin-top:16px; margin-left:10px; font-size:15px; font-weight:600; color:#FFC93C; background:#171410; border:1px solid #C9A227; border-radius:999px; padding:8px 18px; letter-spacing:0.3px; text-decoration:none;">Caption Texts</a>
    </div>
  </header>
  <hr class="gold-rule">

  <h2 class="section">Ready to post</h2>
  <div class="grid" id="pending-list"></div>
  <div class="empty" id="pending-empty" style="display:none;">All posts completed.</div>

  <h2 class="section">Completed</h2>
  <div class="grid" id="done-list"></div>
  <div class="empty" id="done-empty">Nothing completed yet.</div>

  <footer class="site-foot">
    <div class="credit">Powered by <span class="gold">Muhammad Abubaker Hamza</span></div>
  </footer>
</div>
<div id="toast">Caption copied</div>

<script>
var POSTS = [{"id": "post-21", "file": "post-21.png", "title": "The Alamo, 1836", "story": "On the morning of 23 February 1836, lookouts on the walls of the Alamo mission in San Antonio saw dust on the horizon. General Antonio Lopez de Santa Anna had arrived with his Mexican army, and the siege of the Alamo had begun. Inside the old Spanish mission stood fewer than 200 Texian and Tejano volunteers under two young commanders, William Travis and James Bowie, and among them the famous frontiersman Davy Crockett, who had arrived from Tennessee with a dozen men.\n\nTravis knew no help was coming in time. On 24 February he wrote the letter that became one of the most famous in American history, addressed \"To the People of Texas and All Americans in the World\". He promised victory or death, and he asked for reinforcements. Only 32 men from the town of Gonzales managed to slip through the Mexican lines to join him.\n\nFor 13 days the Mexican guns pounded the crumbling walls. The defenders answered with their rifles, and by most accounts they killed or wounded 400 to 600 of Santa Anna's men. Then, before dawn on 6 March, the Mexican army stormed the walls in four columns. After repelling two attacks, the Texians were overwhelmed. Within an hour, every defender inside was dead, including Travis, Bowie and Crockett. The women and children were spared.\n\nSanta Anna believed the slaughter would crush the rebellion. He was wrong. The names of the dead became a battle cry, and six weeks later, on 21 April, Sam Houston's army charged the Mexican camp at San Jacinto shouting \"Remember the Alamo!\" In 18 minutes the battle was over, Santa Anna was captured, and Texas was free. The men who died at the Alamo had bought that victory with their lives."}, {"id": "post-22", "file": "post-22.png", "title": "Sacagawea and the Lewis and Clark Expedition, 1805", "story": "In the winter of 1804, at a trading post called Fort Mandan on the upper Missouri River, two American explorers made the best decision of their expedition. Meriwether Lewis and William Clark had been sent by President Thomas Jefferson to find a way across the continent to the Pacific Ocean, and they needed someone who could talk to the Shoshone people and buy horses for the crossing of the Rocky Mountains. They hired a French-Canadian fur trader named Toussaint Charbonneau, and with him came his young Shoshone wife, Sacagawea. She was about sixteen years old, and she was pregnant.\n\nOn 11 February 1805, Sacagawea gave birth to a baby boy, Jean Baptiste, whom the men nicknamed Little Pomp. Two months later, on 7 April, the expedition set out up the Missouri in canoes, and Sacagawea went with them, her baby strapped to her back. Over the months that followed she proved herself again and again. She found edible plants when the men were hungry, she made moccasins and clothing, and when a canoe overturned she calmly saved the journals and instruments while the men panicked. Because a woman and a baby travelled with the party, the tribes they met knew at once that this was not a war party, and they were welcomed instead of attacked.\n\nIn the mountains, her knowledge saved the expedition a second time. She recognised the country of her childhood, she found the Shoshone and persuaded them to sell horses, and she guided the party through the passes to the Pacific, which they reached in November 1805. They spent the winter at the coast and returned to Fort Mandan in August 1806, having travelled more than 7,000 miles in all. Sacagawea had carried her son about 4,500 of those miles. Without her, the expedition that mapped America might never have come home."}, {"id": "post-23", "file": "post-23.png", "title": "Desmond Doss at Hacksaw Ridge, 1945", "story": "He refused to carry a gun. Then he saved 75 men in one day. Desmond Doss stayed alone on a cliff in Okinawa while everyone else retreated, dragging wounded men to the edge and lowering them down by rope, one by one. He never fired a single shot. Had you ever heard of him?"}, {"id": "post-24", "file": "post-24.png", "title": "Robert Smalls Steals a Confederate Warship, 1862", "story": "He stole a Confederate warship before breakfast and freed everyone he loved. In 1862, enslaved pilot Robert Smalls took the Planter, sailed it past Fort Sumter, and handed it to the Union Navy. Sixteen people woke up free that morning. He later sat in Congress. Which part surprises you more?"}, {"id": "post-25", "file": "post-25.png", "title": "Ruby Bridges Walks to School, 1960", "story": "She was six years old, and it took four federal marshals to walk her to school. In 1960, Ruby Bridges walked past screaming crowds into an empty school in New Orleans and learned alone for a whole year. She never missed a single day. Were you ever taught her story in school?"}, {"id": "post-26", "file": "post-26.png", "title": "Alvin York in the Argonne Forest, 1918", "story": "\"I hear you captured the whole German army.\" \"No sir. I got only 132.\" In 1918, Tennessee farm boy Alvin York stood alone against a hill of machine guns in the Argonne Forest, and 132 enemy soldiers surrendered to him. Do you believe one man really did that in a single morning?"}, {"id": "post-27", "file": "post-27.png", "title": "Charity Adams and the 6888th Battalion, 1945", "story": "17 million letters were stuck in warehouses, and some soldiers had not heard from home in two years. In 1945, 855 Black women of the 6888th Battalion, led by Major Charity Adams, cleared the whole backlog in three months, half the time allowed. Had you ever heard of them?"}];
var LS_KEY = 'us-history-tool-v1';
var state = { done: {}, copies: {}, deleted: {} };

function loadState() {
  try {
    var raw = localStorage.getItem(LS_KEY);
    if (raw) {
      var s = JSON.parse(raw);
      if (s && typeof s === 'object') {
        state.done = s.done || {};
        state.copies = s.copies || {};
        state.deleted = s.deleted || {};
      }
    }
  } catch (e) {}
}
function saveState() {
  try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {}
}

function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  setTimeout(function() { t.style.display = 'none'; }, 1800);
}

function copyText(text, btn) {
  function ok() {
    showToast('Caption copied');
    if (btn) {
      var old = btn.textContent;
      btn.textContent = 'Copied';
      setTimeout(function() { btn.textContent = old; }, 1600);
    }
  }
  function fallback() {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.left = '-9999px';
    ta.style.top = '0';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    var done = false;
    try { done = document.execCommand('copy'); } catch (e) { done = false; }
    document.body.removeChild(ta);
    if (done) { ok(); } else { showToast('Copy failed, hold and copy the caption text'); }
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(ok, fallback);
  } else {
    fallback();
  }
}

function downloadPhoto(post) {
  fetch(post.file).then(function(res) {
    if (!res.ok) { throw new Error('fetch failed'); }
    return res.blob();
  }).then(function(blob) {
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = post.file;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function() { URL.revokeObjectURL(url); }, 4000);
    showToast('Photo downloading');
  }).catch(function() {
    var a2 = document.createElement('a');
    a2.href = post.file;
    a2.download = post.file;
    document.body.appendChild(a2);
    a2.click();
    document.body.removeChild(a2);
    showToast('Photo downloading');
  });
}

function makeCard(post, isDone) {
  var card = document.createElement('div');
  card.className = 'card';

  var img = document.createElement('img');
  img.src = post.file;
  img.alt = post.title;
  card.appendChild(img);

  var body = document.createElement('div');
  body.className = 'card-body';

  var title = document.createElement('div');
  title.className = 'card-title';
  title.textContent = post.title;
  body.appendChild(title);

  var copies = document.createElement('div');
  copies.className = 'copies';
  var n = state.copies[post.id] || 0;
  copies.textContent = 'Caption copied ' + n + (n === 1 ? ' time' : ' times');
  body.appendChild(copies);

  var row = document.createElement('div');
  row.className = 'btnrow';

  var dl = document.createElement('button');
  dl.className = 'gold';
  dl.textContent = 'Download Photo';
  dl.onclick = function() { downloadPhoto(post); };
  row.appendChild(dl);

  var cp = document.createElement('button');
  cp.textContent = 'Copy Caption';
  cp.onclick = function() {
    state.copies[post.id] = (state.copies[post.id] || 0) + 1;
    saveState();
    copies.textContent = 'Caption copied ' + state.copies[post.id] + (state.copies[post.id] === 1 ? ' time' : ' times');
    copyText(post.story, cp);
  };
  row.appendChild(cp);

  var cap = document.createElement('div');
  cap.className = 'caption';
  cap.textContent = post.story;

  var sc = document.createElement('button');
  sc.textContent = 'Show Caption';
  sc.onclick = function() {
    if (cap.className.indexOf('open') >= 0) {
      cap.className = 'caption';
      sc.textContent = 'Show Caption';
    } else {
      cap.className = 'caption open';
      sc.textContent = 'Hide Caption';
    }
  };
  row.appendChild(sc);

  if (!isDone) {
    var dn = document.createElement('button');
    dn.className = 'done-btn';
    dn.textContent = 'Complete';
    dn.onclick = function() {
      if (dn.getAttribute('data-confirm') === '1') {
        state.done[post.id] = true;
        saveState();
        render();
        showToast('Post completed');
      } else {
        dn.setAttribute('data-confirm', '1');
        dn.textContent = 'Tap again to confirm';
        setTimeout(function() {
          dn.removeAttribute('data-confirm');
          dn.textContent = 'Complete';
        }, 3000);
      }
    };
    row.appendChild(dn);
  } else {
    var un = document.createElement('button');
    un.className = 'undo-btn';
    un.textContent = 'Undo';
    un.onclick = function() {
      delete state.done[post.id];
      saveState();
      render();
      showToast('Post moved back');
    };
    row.appendChild(un);
  }

  var del = document.createElement('button');
  del.className = 'delete-btn';
  del.textContent = 'Delete';
  del.onclick = function() {
    if (del.getAttribute('data-confirm') === '1') {
      state.deleted[post.id] = true;
      saveState();
      render();
      showToast('Post deleted');
    } else {
      del.setAttribute('data-confirm', '1');
      del.textContent = 'Tap again to delete';
      setTimeout(function() {
        del.removeAttribute('data-confirm');
        del.textContent = 'Delete';
      }, 3000);
    }
  };
  row.appendChild(del);

  body.appendChild(row);
  body.appendChild(cap);
  card.appendChild(body);
  return card;
}

function render() {
  var pending = document.getElementById('pending-list');
  var doneList = document.getElementById('done-list');
  pending.innerHTML = '';
  doneList.innerHTML = '';
  var doneCount = 0;
  var visibleCount = 0;
  for (var i = 0; i < POSTS.length; i++) {
    var p = POSTS[i];
    if (state.deleted[p.id]) { continue; }
    visibleCount++;
    if (state.done[p.id]) {
      doneList.appendChild(makeCard(p, true));
      doneCount++;
    } else {
      pending.appendChild(makeCard(p, false));
    }
  }
  document.getElementById('progress').textContent = doneCount + ' of ' + POSTS.length + ' completed';
  document.getElementById('pending-empty').style.display = (visibleCount > 0 && doneCount === visibleCount) ? 'block' : 'none';
  document.getElementById('done-empty').style.display = (doneCount === 0) ? 'block' : 'none';
}

loadState();
render();
</script>
</body>
</html>
