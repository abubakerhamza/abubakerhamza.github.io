<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>US History Caption Texts</title>
<link rel="icon" href="cartoon.webp">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: #0A0A0A;
    background-image: radial-gradient(ellipse 900px 480px at 50% -80px, rgba(201,162,39,0.14), rgba(10,10,10,0) 70%);
    color: #F7F3E9;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    padding: 28px 16px 0;
    min-height: 100vh;
  }
  .wrap { max-width: 900px; margin: 0 auto; }
  h1 {
    font-family: Georgia, 'Playfair Display', 'Times New Roman', serif;
    font-size: 40px; line-height: 1.08; font-weight: bold;
    color: #F7F3E9; letter-spacing: 0.5px;
  }
  h1 .gold { color: #FFC93C; }
  .back-link {
    display: inline-block; margin-top: 16px;
    font-size: 15px; font-weight: 600; color: #FFC93C;
    background: #171410; border: 1px solid #C9A227; border-radius: 999px;
    padding: 8px 18px; letter-spacing: 0.3px; text-decoration: none;
  }
  .back-link:hover { background: #262626; }
  .gold-rule { height: 2px; background: linear-gradient(90deg, rgba(201,162,39,0), #C9A227 18%, #FFC93C 50%, #C9A227 82%, rgba(201,162,39,0)); border: 0; margin: 22px 0 26px; }
  .list { display: grid; grid-template-columns: 1fr; gap: 26px; }
  .card {
    background: linear-gradient(180deg, #171717, #101010);
    border: 1px solid #2e2e2e; border-radius: 16px;
    padding: 18px 20px 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.55);
  }
  .card-title {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 21px; font-weight: bold; line-height: 1.3; margin-bottom: 12px;
  }
  .caption-text {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 15.5px; line-height: 1.65; white-space: pre-wrap;
    background: #0b0b0b; border: 1px solid #2c2c2c; border-radius: 10px; padding: 14px 16px;
  }
  .btnrow { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
  button {
    font-family: inherit; font-size: 16px; font-weight: 600;
    min-height: 50px; padding: 12px 18px;
    border-radius: 10px; border: 1px solid #C9A227;
    background: #1f1f1f; color: #F7F3E9; cursor: pointer;
    transition: transform 0.08s ease, opacity 0.15s ease, background 0.15s ease;
  }
  button:hover { background: #262626; }
  button:active { opacity: 0.85; transform: scale(0.98); }
  button.gold { background: linear-gradient(180deg, #FFC93C, #f0b41f); color: #0A0A0A; border-color: #FFC93C; }
  button.gold:hover { background: linear-gradient(180deg, #ffd35c, #FFC93C); }
  button.delete-btn { background: #7f1d1d; border-color: #c04545; color: #F7F3E9; }
  button.delete-btn:hover { background: #991f1f; }
  .empty { font-size: 15.5px; color: #bdb6a4; padding: 4px 0 16px; display: none; }
  footer.site-foot {
    margin-top: 44px; padding: 22px 10px 30px;
    border-top: 1px solid #2c2c2c; text-align: center;
  }
  footer.site-foot .credit {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 17px; color: #F7F3E9; letter-spacing: 0.4px;
  }
  footer.site-foot .credit .gold { color: #FFC93C; }
  #toast {
    position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%);
    background: #FFC93C; color: #0A0A0A; font-size: 16px; font-weight: bold;
    padding: 12px 22px; border-radius: 24px; display: none; z-index: 99;
    box-shadow: 0 4px 14px rgba(0,0,0,0.6); max-width: 92vw; text-align: center;
  }
  @media (max-width: 640px) {
    body { padding: 20px 12px 0; }
    h1 { font-size: 30px; }
    .card { padding: 14px 14px 16px; }
    .card-title { font-size: 19px; }
    button { flex: 1 1 auto; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>US History <span class="gold">Caption Texts</span></h1>
    <a class="back-link" href="index.html">Back to Posts</a>
  </header>
  <hr class="gold-rule">

  <div class="list" id="text-list"></div>
  <div class="empty" id="text-empty">All caption texts deleted.</div>

  <footer class="site-foot">
    <div class="credit">Powered by <span class="gold">Muhammad Abubaker Hamza</span></div>
  </footer>
</div>
<div id="toast">Text copied</div>

<script>
var TEXTS = [{"id": "post-23", "title": "Desmond Doss at Hacksaw Ridge, 1945", "story": "He refused to carry a gun. Then he saved 75 men in one day. Desmond Doss stayed alone on a cliff in Okinawa while everyone else retreated, dragging wounded men to the edge and lowering them down by rope, one by one. He never fired a single shot. Had you ever heard of him?"}, {"id": "post-24", "title": "Robert Smalls Steals a Confederate Warship, 1862", "story": "He stole a Confederate warship before breakfast and freed everyone he loved. In 1862, enslaved pilot Robert Smalls took the Planter, sailed it past Fort Sumter, and handed it to the Union Navy. Sixteen people woke up free that morning. He later sat in Congress. Which part surprises you more?"}, {"id": "post-25", "title": "Ruby Bridges Walks to School, 1960", "story": "She was six years old, and it took four federal marshals to walk her to school. In 1960, Ruby Bridges walked past screaming crowds into an empty school in New Orleans and learned alone for a whole year. She never missed a single day. Were you ever taught her story in school?"}, {"id": "post-26", "title": "Alvin York in the Argonne Forest, 1918", "story": "\"I hear you captured the whole German army.\" \"No sir. I got only 132.\" In 1918, Tennessee farm boy Alvin York stood alone against a hill of machine guns in the Argonne Forest, and 132 enemy soldiers surrendered to him. Do you believe one man really did that in a single morning?"}, {"id": "post-27", "title": "Charity Adams and the 6888th Battalion, 1945", "story": "17 million letters were stuck in warehouses, and some soldiers had not heard from home in two years. In 1945, 855 Black women of the 6888th Battalion, led by Major Charity Adams, cleared the whole backlog in three months, half the time allowed. Had you ever heard of them?"}];
var LS_KEY = 'us-history-texts-v1';
var deleted = {};

function loadState() {
  try {
    var raw = localStorage.getItem(LS_KEY);
    if (raw) {
      var s = JSON.parse(raw);
      if (s && typeof s === 'object') {
        deleted = s.deleted || {};
      }
    }
  } catch (e) {}
}
function saveState() {
  try { localStorage.setItem(LS_KEY, JSON.stringify({ deleted: deleted })); } catch (e) {}
}

function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  setTimeout(function() { t.style.display = 'none'; }, 1800);
}

function copyText(text, btn) {
  function ok() {
    showToast('Text copied');
    if (btn) {
      var old = btn.textContent;
      btn.textContent = 'Copied';
      setTimeout(function() { btn.textContent = old; }, 1600);
    }
  }
  function fallback() {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.left = '-9999px';
    ta.style.top = '0';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    var done = false;
    try { done = document.execCommand('copy'); } catch (e) { done = false; }
    document.body.removeChild(ta);
    if (done) { ok(); } else { showToast('Copy failed, hold and copy the text'); }
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(ok, fallback);
  } else {
    fallback();
  }
}

function makeCard(item) {
  var card = document.createElement('div');
  card.className = 'card';

  var title = document.createElement('div');
  title.className = 'card-title';
  title.textContent = item.title;
  card.appendChild(title);

  var text = document.createElement('div');
  text.className = 'caption-text';
  text.textContent = item.story;
  card.appendChild(text);

  var row = document.createElement('div');
  row.className = 'btnrow';

  var cp = document.createElement('button');
  cp.className = 'gold';
  cp.textContent = 'Copy Text';
  cp.onclick = function() { copyText(item.story, cp); };
  row.appendChild(cp);

  var del = document.createElement('button');
  del.className = 'delete-btn';
  del.textContent = 'Delete';
  del.onclick = function() {
    if (del.getAttribute('data-confirm') === '1') {
      deleted[item.id] = true;
      saveState();
      render();
      showToast('Text deleted');
    } else {
      del.setAttribute('data-confirm', '1');
      del.textContent = 'Tap again to delete';
      setTimeout(function() {
        del.removeAttribute('data-confirm');
        del.textContent = 'Delete';
      }, 3000);
    }
  };
  row.appendChild(del);

  card.appendChild(row);
  return card;
}

function render() {
  var list = document.getElementById('text-list');
  list.innerHTML = '';
  var visible = 0;
  for (var i = 0; i < TEXTS.length; i++) {
    var item = TEXTS[i];
    if (deleted[item.id]) { continue; }
    visible++;
    list.appendChild(makeCard(item));
  }
  document.getElementById('text-empty').style.display = (visible === 0) ? 'block' : 'none';
}

loadState();
render();
</script>
</body>
</html>
